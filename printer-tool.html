<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e3a8a">
<title>云打印命令模拟工具(多设备批量查询)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js'"></script>
<script src="https://cdn.jsdelivr.net/npm/gbk.js/dist/gbk.min.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/gbk.js/dist/gbk.min.js'"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.7.0/build/highlight.min.js';document.head.appendChild(s)"></script>
<style>
  /* ========== 设计变量与重置 ========== */
  :root{
    --bg:#eef1f7; --card:#fff; --line:#e3e8f0; --text:#1b2437; --muted:#6b7690;
    --pri:#2563eb; --ok:#15803d; --warn:#b45309; --err:#dc2626;
    --code-bg:#0d1117; --shadow:0 6px 24px rgba(23,32,56,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"PingFang SC","HarmonyOS Sans","Microsoft YaHei","Segoe UI",Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.6;min-height:100vh;
  }
  .mono{font-family:Consolas,"Courier New",monospace}
  button{font-family:inherit}
  :focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  /* ========== 顶栏 ========== */
  .topbar{background:linear-gradient(120deg,#1e3a8a,#2563eb 55%,#0ea5e9);color:#fff;padding:16px 20px;box-shadow:var(--shadow)}
  .topbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center}
  .brand-ic svg{width:22px;height:22px}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:.5px}
  .brand p{font-size:12px;opacity:.85}
  .chip-warn{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
  .chip-warn svg{width:13px;height:13px}

  .page{max-width:1200px;margin:0 auto;padding:18px 16px 32px;display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 20px;box-shadow:var(--shadow)}
  .card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
  .card-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
  .card-ic svg{width:19px;height:19px}
  .ic-blue{background:#eff6ff;border:1px solid #dbeafe;color:#2563eb}
  .ic-violet{background:#f5f3ff;border:1px solid #ede9fe;color:#7c3aed}
  .card-head h2{font-size:16.5px;font-weight:700}
  .card-head p{font-size:12.5px;color:var(--muted);margin-top:2px}

  /* ========== 批量查询 ========== */
  .query-row{display:grid;gap:12px}
  @media(min-width:720px){.query-row{grid-template-columns:fit-content(560px) auto;align-items:start;justify-content:start}}
  textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;line-height:1.7;resize:vertical;background:#fbfcfe;font-family:inherit}
  textarea.mono{font-family:Consolas,"Courier New",monospace}
  textarea:focus,input[type=text]:focus,input[type=number]:focus{outline:2px solid #bfdbfe;border-color:var(--pri)}
  textarea[readonly]{background:#f4f6fa}
  /* 批量查询输入框:宽度由 JS 按最长行自动调节 */
  #multiDeviceInput{width:auto;min-width:240px;max-width:100%}
  .query-side{display:flex;flex-direction:column;gap:8px}
  .tip{font-size:12px;color:var(--muted)}
  .empty-tip{text-align:center;color:var(--muted);font-size:13px;padding:18px;border:1px dashed var(--line);border-radius:10px;margin-top:14px}

  /* ========== 通用按钮 ========== */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;
    border:1px solid transparent;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;
    transition:transform .16s,filter .16s,background .16s,border-color .16s,box-shadow .16s;user-select:none;color:var(--text);background:#fff}
  .btn svg{width:16px;height:16px;flex:none}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(135deg,var(--pri),#3b82f6);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.3)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{border-color:var(--line);background:#fff}
  .btn-ghost:hover{border-color:#c6d2e6;background:#f8fafd}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
  .btn-sm svg{width:13px;height:13px}
  .btn:disabled{background:#eef1f5;color:#a3adc2;cursor:not-allowed;box-shadow:none;filter:none;transform:none}

  /* ========== 操作按钮(行内操作弹窗复用) ========== */
  .op-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 6px}
  @media(min-width:860px){.op-grid{grid-template-columns:repeat(4,1fr)}}
  .op-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 10px;border-radius:12px;
    border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;
    transition:transform .16s,box-shadow .16s,background .16s,border-color .16s}
  .op-btn svg{width:17px;height:17px;flex:none}
  .op-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(23,32,56,.1)}
  .op-btn:active{transform:scale(.97)}
  .op-btn:disabled{cursor:not-allowed;transform:none;box-shadow:none;background:#f3f5f9;color:#a3adc2}
  .op-btn:disabled svg{color:#a3adc2!important}
  .op-amber svg{color:#d97706}.op-sky svg{color:#0284c7}.op-green svg{color:#16a34a}
  .op-teal svg{color:#0d9488}.op-violet svg{color:#7c3aed}.op-indigo svg{color:#4f46e5}
  .op-amber:hover{border-color:#fcd34d;background:#fffbeb}
  .op-sky:hover{border-color:#7dd3fc;background:#f0f9ff}
  .op-green:hover{border-color:#86efac;background:#f0fdf4}
  .op-teal:hover{border-color:#5eead4;background:#f0fdfa}
  .op-violet:hover{border-color:#c4b5fd;background:#faf5ff}
  .op-indigo:hover{border-color:#a5b4fc;background:#eef2ff}
  .op-btn:disabled:hover{background:#f3f5f9;border-color:var(--line)}

  /* ========== 响应结果 ========== */
  .res-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
  .res-head p{font-size:13.5px;font-weight:700}
  pre{background:var(--code-bg);color:#c9d1d9;border-radius:12px;padding:14px;overflow:auto;max-height:260px;
    font-size:12.5px;line-height:1.6;border:1px solid #262d3a}
  pre code{font-family:Consolas,"Courier New",monospace;background:transparent;padding:0}

  /* ========== 加载遮罩 ========== */
  #loading{display:none;position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.45);align-items:center;justify-content:center}
  .loading-box{display:flex;align-items:center;gap:10px;background:#fff;color:var(--text);padding:14px 22px;border-radius:12px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);font-size:14.5px;font-weight:600}
  .spin{width:18px;height:18px;border-radius:50%;border:3px solid #dbe4f3;border-top-color:var(--pri);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ========== 弹窗 ========== */
  .modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:10000;display:flex;align-items:center;justify-content:center;padding:14px}
  .modal-box{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:#fff;z-index:2;border-radius:16px 16px 0 0}
  .modal-head h4{font-size:15.5px;font-weight:700}
  .modal-x{width:30px;height:30px;border:none;background:#f1f4f9;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:#5b6472}
  .modal-x:hover{background:#e4e9f2}
  .modal-x svg{width:15px;height:15px}
  /* 弹窗头部「← 返回」按钮(打印机操作的下级弹窗用) */
  .modal-back{height:30px;padding:0 12px;margin-right:8px;border:none;background:#f1f4f9;border-radius:8px;cursor:pointer;
    display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:#5b6472;flex:none}
  .modal-back:hover{background:#e4e9f2}
  body.dark .modal-back{background:#243049;color:#c7d2e5}
  /* 版本更新记录列表 */
  .ver-his-item{padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.7}
  .ver-his-item:last-child{border-bottom:none}
  .ver-his-item b{color:var(--pri)}

  /* ========== 手机版布局(body.mobile:手机/平板访问,或链接带 ?m=1) ========== */
  body.mobile .topbar{padding:12px}
  body.mobile .topbar-inner{justify-content:center;gap:10px}
  body.mobile .brand{flex-direction:column;align-items:center;gap:6px;text-align:center}
  body.mobile .page{padding:12px 10px 24px;gap:12px}
  body.mobile .card{padding:14px 12px 16px}
  body.mobile .btn{padding:12px 16px;font-size:15px}
  body.mobile .btn-sm{padding:9px 14px}
  body.mobile .query-row{grid-template-columns:1fr}
  body.mobile .query-side{width:100%}
  body.mobile #multiDeviceInput{width:100%!important;min-width:0}
  /* 输入框 16px:防止 iOS Safari 聚焦时自动放大页面 */
  body.mobile textarea,body.mobile .modal-body input[type=text],body.mobile .modal-body input[type=number],
  body.mobile .modal-body select,body.mobile #autoRefreshMin{font-size:16px}
  /* 弹窗改手机底部抽屉样式 */
  body.mobile .modal-wrap{padding:0;align-items:flex-end}
  body.mobile .modal-box{max-width:100%;max-height:92vh;border-radius:16px 16px 0 0}
  body.mobile .modal-foot{flex-wrap:wrap}
  body.mobile .modal-foot .btn{flex:1;min-width:120px}
  body.mobile .mm-input-row{flex-direction:column}
  body.mobile .chips .chip-opt span{padding:11px 8px}
  body.mobile .res-head{flex-wrap:wrap;gap:8px}
  /* 手机版隐藏分享按钮;默认隐藏打印机操作列(输对管理密码后恢复) */
  body.mobile #shareBtn{display:none}
  body.mobile:not(.show-ops) .ops-col{display:none}
  .modal-body{padding:16px 18px}
  .modal-body label{display:block;font-size:13px;font-weight:600;margin:10px 0 6px}
  .modal-body input[type=text],.modal-body input[type=number],.modal-body textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit}
  .modal-body textarea{font-size:13px;line-height:1.6;resize:vertical}
  .modal-body textarea.mono{font-family:Consolas,"Courier New",monospace}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 18px 16px}
  .modal-note{font-size:12.5px;color:var(--muted);background:#f6f8fc;border:1px solid #e6ebf4;padding:8px 12px;border-radius:8px;margin:0 0 10px}
  .chk{display:flex!important;align-items:center;gap:8px;font-size:13.5px!important;font-weight:500!important;margin:8px 0!important;cursor:pointer}
  .mm-input-row{display:flex;gap:12px;margin:4px 0 10px}
  .mm-input-row>div{flex:1}
  .chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:6px 0 4px}
  .chip-opt{position:relative;display:block}
  .chip-opt input{position:absolute;opacity:0;pointer-events:none}
  .chip-opt span{display:block;text-align:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
    font-size:13.5px;cursor:pointer;transition:.15s;background:#fff}
  .chip-opt:hover span{border-color:#b9c8e2}
  .chip-opt input:checked+span{border-color:var(--pri);background:#eff6ff;color:var(--pri);font-weight:700}
  .chip-opt input:focus-visible+span{outline:2px solid #93c5fd;outline-offset:2px}

  /* 配网二维码弹窗 */
  .qr-modal .modal-body{text-align:center}
  .qr-dev{font-family:Consolas,"Courier New",monospace;font-weight:700}
  .qr-url{font-size:12px;color:var(--muted);word-break:break-all;margin:6px 0 12px}
  #qrShowBox{display:flex;justify-content:center;align-items:center;padding:12px;background:#fff;border:1px solid var(--line);
    border-radius:12px;width:fit-content;margin:0 auto;min-height:100px}
  #qrShowBox img,#qrShowBox canvas{display:block}

  /* ========== 结果表格 ========== */
  .table-wrap{overflow-x:auto;margin:14px 0 0;border:1px solid var(--line);border-radius:12px}
  .result-table{width:100%;min-width:960px;border-collapse:collapse;background:#fff}
  .result-table th{background:#334155;color:#fff;font-size:13px;padding:11px 10px;text-align:left;white-space:nowrap}
  .result-table td{border-top:1px solid var(--line);padding:10px;font-size:13.5px;vertical-align:middle}
  .result-table tbody tr:nth-child(even){background:#f8fafd}
  .result-table tbody tr:hover{background:#eef5ff}
  .result-table tr.err-row{background:#fef2f2!important}
  .result-table tr.err-row:hover{background:#fde8e8!important}
  .dev-cell{font-family:Consolas,"Courier New",monospace;font-weight:600}
  .cell-mono{font-family:Consolas,"Courier New",monospace;font-size:13px}
  .err-text{color:var(--err);font-weight:600}
  .qrcode-text-btn{color:var(--pri);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .qrcode-text-btn:hover{text-decoration:underline}
  .qrcode-text-btn svg{width:13px;height:13px}
  .dev-copy{cursor:pointer}
  .dev-copy:hover{color:var(--pri)}
  .dev-copy:hover .dev-id-text{text-decoration:underline}
  .dev-copy.copied{color:var(--ok)}
  .dev-copy svg{width:12px;height:12px;margin-left:4px;color:#9aa6bd;vertical-align:-1px}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill-ok{background:#ecfdf5;color:#15803d}
  .pill-err{background:#fef2f2;color:#dc2626}
  .pill-warn{background:#fffbeb;color:#b45309}
  .pill-gray{background:#f1f4f9;color:#64748b}
  .sum-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  .batch-summary{font-size:12.5px;color:var(--muted);margin:0}

  /* 行内打印机操作 */
  .modal-ops{grid-template-columns:repeat(2,1fr);margin:8px 0 4px}
  .cell-dim{color:#c3cad9;text-align:center}

  /* 内容打印工具 */
  .ops-group{font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 2px}
  .fav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fbfcfe;flex-wrap:wrap}
  .fav-name{font-weight:700;font-size:13px;flex:none}
  .fav-cmd{flex:1;min-width:120px;font-family:Consolas,"Courier New",monospace;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fav-item .btn{flex:none}
  .img-preview{display:block;max-width:240px;width:100%;margin:8px auto;border:1px solid var(--line);border-radius:8px;background:#fff;image-rendering:pixelated}
  .modal-body input[type=range]{width:100%;margin:4px 0 8px;padding:0;border:none;accent-color:var(--pri)}

  /* 行级编辑器 / 商品清单行 */
  .line-row,.item-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fbfcfe;flex-wrap:wrap}
  .line-row input[type=text]{flex:1 1 150px;width:auto!important}
  .item-row input[type=text]{flex:1 1 130px;width:auto!important}
  .item-row input[type=number]{width:86px!important;flex:none}
  .line-row select{padding:5px 6px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:#fff;color:var(--text);flex:none}
  .line-row input[type=checkbox]{flex:none;margin:0}
  .mini-btn{width:26px;height:26px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-size:13px;line-height:1;color:var(--muted);flex:none;display:inline-flex;align-items:center;justify-content:center}
  .mini-btn:hover{border-color:var(--pri);color:var(--pri)}
  .item-amt{font-size:12px;color:var(--muted);min-width:56px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
  .fav-save-row{display:flex;gap:8px;margin:4px 0 8px}
  .fav-save-row input{flex:1}

  /* 自动刷新 */
  .auto-refresh-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
  #autoRefreshMin{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:7px}

  /* 云端公告条(notice.txt) */
  .notice-bar{display:flex;align-items:flex-start;gap:10px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;
    padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.6}
  .notice-bar .n-ic{flex:none;font-size:15px}
  .notice-bar .n-txt{flex:1;white-space:pre-line;word-break:break-word}
  .notice-bar .n-x{flex:none;width:24px;height:24px;border:none;background:transparent;color:#b45309;cursor:pointer;
    font-size:15px;line-height:1;border-radius:6px}
  .notice-bar .n-x:hover{background:#fef3c7}

  /* 深色模式切换按钮 */
  .theme-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;cursor:pointer;font-family:inherit}
  .theme-toggle:hover{background:rgba(255,255,255,.24)}
  .theme-toggle svg{width:13px;height:13px}
  .theme-toggle .upd-dot{display:none;width:8px;height:8px;border-radius:50%;background:#fbbf24;flex:none}
  .theme-toggle.has-new{background:rgba(251,191,36,.28);border-color:#fbbf24}
  .theme-toggle.has-new .upd-dot{display:inline-block}

  /* ========== 深色模式(手动切换,本机记忆) ========== */
  body.dark{--bg:#0e1420;--card:#151c2b;--line:#28324a;--text:#e3e9f2;--muted:#8e99b3}
  body.dark .btn{background:#1d2739;color:var(--text)}
  body.dark .btn-ghost{border-color:var(--line);background:#1d2739}
  body.dark .btn-ghost:hover{background:#243049}
  body.dark .btn:disabled{background:#1a2233;color:#5b667e}
  body.dark textarea,body.dark .modal-body input[type=text],body.dark .modal-body input[type=number],
  body.dark .modal-body select,body.dark #autoRefreshMin{background:#101726;color:var(--text);border-color:var(--line)}
  body.dark textarea[readonly]{background:#0d1320}
  body.dark .chip-opt span,body.dark .op-btn{background:#1d2739;color:var(--text)}
  body.dark .chip-opt input:checked+span{background:#1c3153;color:#93c5fd;border-color:#3b82f6}
  body.dark .op-btn:hover{background:#243049}
  body.dark .op-btn:disabled{background:#1a2233;color:#5b667e}
  body.dark .modal-box,body.dark .modal-head,body.dark .loading-box{background:#151c2b}
  body.dark .modal-x{background:#243049;color:#c7d2e5}
  body.dark .modal-note{background:#101726;border-color:var(--line)}
  body.dark .empty-tip{border-color:var(--line)}
  body.dark .line-row,body.dark .item-row,body.dark .fav-item{background:#101726}
  body.dark .mini-btn{background:#1d2739;color:var(--muted)}
  body.dark .line-row select{background:#101726;color:var(--text)}
  body.dark .result-table tbody tr:nth-child(even){background:#131a29}
  body.dark .result-table tbody tr:hover{background:#18233a}

<script>
    /* ========== 核心工具(网络层 / 结果渲染 / 弹窗工厂) ========== */
    function showLoading(show) {
        document.getElementById("loading").style.display = show ? "flex" : "none";
    }
    function toFormData(obj) {
        const formData = new URLSearchParams();
        Object.keys(obj).forEach(key => {
            if (obj[key] !== undefined && obj[key] !== null) {
                formData.append(key, obj[key]);
            }
        });
        return formData;
    }
    /* 网络层:优先原生 fetch(无 CDN 依赖);axios 可用时走 axios。
       彻底解决 unpkg 被墙导致整个工具不可用的问题。 */
    function postForm(url, params) {
        if (window.axios && axios.post) {
            return axios.post(url, toFormData(params)).then(r => r.data);
        }
        if (window.fetch) {
            return fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                body: toFormData(params).toString()
            }).then(r => r.json());
        }
        return Promise.reject(new Error("网络库加载失败(fetch / axios 均不可用)"));
    }
    /* 结果统一以 textContent 写入(修复原 innerHTML 的 XSS 注入隐患),再做高亮 */
    function renderRes(data) {
        const el = document.getElementById("res");
        const text = (typeof data === "string") ? data : JSON.stringify(data, null, 2);
        el.removeAttribute("data-highlighted");
        el.textContent = text || "(空响应)";
        if (window.hljs && hljs.highlightElement) {
            try { hljs.highlightElement(el); } catch (e) { /* 高亮失败不影响内容展示 */ }
        }
    }
    function showResError(msg) {
        const el = document.getElementById("res");
        el.removeAttribute("data-highlighted");
        el.textContent = msg;
    }
    /* 统一封装:下发十六进制打印指令(合并原 5 处重复代码) */
    function sendHexCmd(deviceId, cmd, apiKey) {
        if (!ensureCreds()) return;   /* 未配置凭据:弹输入框并拦下本次操作 */
        showLoading(true);
        postForm(printer_url, {
            apiKey: apiKey || "ec-printer-mqtt-develop-print",
            secretId: secretId,
            secretKey: secretKey,
            deviceId: deviceId,
            cmd: cmd
        })
        .then(data => renderRes(data && data.data ? data.data : data))
        .catch(() => showResError("执行失败:请求未发出或网络异常"))
        .finally(() => showLoading(false));
    }
    function legacyCopy(text, ok) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); ok(); }
        catch (e) { alert("复制失败,请手动选择复制"); }
        ta.remove();
    }
    function copyRes() {
        const t = document.getElementById("res").textContent;
        if (!t) { alert("暂无结果可复制"); return; }
        const ok = () => alert("已复制到剪贴板");
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(t).then(ok, () => legacyCopy(t, ok));
        } else {
            legacyCopy(t, ok);
        }
    }
    /* 弹窗工厂:标题用 textContent 写入,避免注入;点遮罩 / × / Esc 关闭 */
    function closeModalWrap() {
        const wrap = document.querySelector(".modal-wrap");
        if (wrap) wrap.remove();
    }
    function openModal(title, bodyHtml, footHtml, extraClass) {
        closeModalWrap();
        const wrap = document.createElement("div");
        wrap.className = "modal-wrap";
        wrap.innerHTML = '<div class="modal-box ' + (extraClass || "") + '">' +
            '<div class="modal-head"><h4></h4>' +
            '<button type="button" class="modal-x" aria-label="关闭">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
            "</button></div>" +
            '<div class="modal-body">' + bodyHtml + "</div>" +
            (footHtml ? '<div class="modal-foot">' + footHtml + "</div>" : "") +
            "</div>";
        wrap.querySelector(".modal-head h4").textContent = title;
        wrap.onclick = e => { if (e.target === wrap) wrap.remove(); };
        wrap.querySelector(".modal-x").onclick = () => wrap.remove();
        wrap.querySelectorAll("[data-close]").forEach(b => { b.onclick = () => wrap.remove(); });
        document.body.appendChild(wrap);
        return wrap;
    }
    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeModalWrap();
    });
    /* 深色模式切换(写入本机记忆) */
    document.getElementById("themeToggle").onclick = function () {
        const dark = document.body.classList.toggle("dark");
        try { localStorage.setItem("YK_THEME", dark ? "dark" : "light"); } catch (e) { /* 隐私模式忽略 */ }
        this.setAttribute("aria-pressed", dark ? "true" : "false");
    };

    /* ========== 接口凭据(外置):首次使用时输入,本机永久记忆;顶栏徽章可查看/修改 ========== */
    function updCredChip() {
        const t = document.getElementById("credChipTxt");
        if (t) t.textContent = (secretId && secretKey) ? "接口凭据:已配置" : "接口凭据:未配置 · 点击输入";
    }
    function openCredsModal() {
        const wrap = openModal("接口凭据配置",
            '<p class="modal-note">凭据只保存在本机浏览器,不会上传任何服务器;换电脑 / 换浏览器需重新输入,凭据向管理员索取</p>' +
            '<label for="credSid">secretId(凭据 1)</label>' +
            '<input type="text" id="credSid" autocomplete="off" spellcheck="false" placeholder="粘贴 secretId">' +
            '<label for="credSkey">secretKey(凭据 2)</label>' +
            '<input type="text" id="credSkey" autocomplete="off" spellcheck="false" placeholder="粘贴 secretKey">',
            '<button type="button" class="btn btn-ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn-primary" id="credOk">保存</button>');
        const sid = wrap.querySelector("#credSid");
        sid.value = secretId;
        wrap.querySelector("#credSkey").value = secretKey;
        sid.focus();
        wrap.querySelector("#credOk").onclick = function () {
            const v1 = sid.value.trim();
            const v2 = wrap.querySelector("#credSkey").value.trim();
            if (!v1 || !v2) { alert("两个凭据都要填写"); return; }
            secretId = v1;
            secretKey = v2;
            try {
                localStorage.setItem("YK_SID", v1);
                localStorage.setItem("YK_SKEY", v2);
            } catch (e) { /* 隐私模式:仅本次打开有效 */ }
            updCredChip();
            wrap.remove();
            alert("凭据已保存到本机,这台设备以后不用再输");
        };
    }
    document.getElementById("credChip").onclick = openCredsModal;
    /* 所有联网操作前的凭据检查:没配置就弹出输入框并拦下本次操作 */
    function ensureCreds() {
        if (secretId && secretKey) return true;
        openCredsModal();
        return false;
    }
    updCredChip();

    /* ========== 在线更新:从内置 GitHub 源或自建源地址检测新版并下载 ========== */
    /* 依次尝试多个源地址(国内对 CDN 域名的干扰时有波动),任一成功即返回其内容与实际地址 */
    function updFetchText(urls) {
        let i = 0;
        function tryOne() {
            if (i >= urls.length) return Promise.reject(new Error("all failed"));
            const u = urls[i++];
            return fetch(u, { cache: "no-store" })
                .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text().then(t => ({ t: t, u: u })); })
                .catch(() => tryOne());
        }
        return tryOne();
    }
    /* 解析远端内容:支持 version.json({version,url,note})、网页里内嵌的版本清单(如语雀文档贴的一行)、或最新版 HTML 本身 */
    function updParseVer(t) {
        const s = String(t).trim();
        /* 1) 整份内容就是 version.json */
        if (s.charAt(0) === "{") {
            try {
                const j = JSON.parse(s);
                if (j && (j.version || j.v)) {
                    return { ver: String(j.version || j.v), url: j.url || null, note: j.note || j.changelog || "" };
                }
            } catch (e) { /* 不是 JSON,按 HTML 继续 */ }
        }
        /* 2) 网页正文里内嵌的 {"version":"x.y","url":"…"} 清单 */
        const jm = s.match(/\{[^{}]*"version"\s*:\s*"?[\d\.]+"?[^{}]*\}/);
        if (jm) {
            try {
                const j = JSON.parse(jm[0]);
                if (j && j.version && j.url) return { ver: String(j.version), url: j.url, note: j.note || "" };
            } catch (e) { /* 内嵌段不是合法 JSON 就忽略 */ }
        }
        /* 3) 新版 HTML 本身:读取其中的 APP_VERSION="x.y" */
        const m = s.match(/APP_VERSION\s*=\s*"([\d\.]+)"/);
        return m ? { ver: m[1], url: null, note: "" } : null;
    }
    /* 版本比较:逐段数字比较,支持 2.9 < 2.10 */
    function updIsNewer(a, b) {
        const x = String(a).split(".").map(n => parseInt(n, 10) || 0);
        const y = String(b).split(".").map(n => parseInt(n, 10) || 0);
        const len = Math.max(x.length, y.length);
        for (let i = 0; i < len; i++) {
            const dx = x[i] || 0, dy = y[i] || 0;
            if (dx !== dy) return dx > dy;
        }
        return false;
    }
    /* 静默检测 / 手动检测共享的新版信息;打开更新弹窗时直接展示,不用重新检测 */
    var updFound = null;
    function openUpdateModal() {
        const wrap = openModal("在线更新",
            '<p class="modal-note">已内置 GitHub 更新源(国内 CDN 加速,多镜像自动切换),留空直接检测即可;也可换成自己服务器的直链(本机记忆)</p>' +
            '<p class="tip" style="margin:0 0 6px">当前版本:v' + APP_VERSION + '</p>' +
            "<label for=\"updUrl\">更新源地址</label>" +
            '<input type="text" id="updUrl" placeholder="留空使用内置源;或填自建直链,如 http://内网服务器/云打印机命令工具.html" autocomplete="off" spellcheck="false">' +
            '<div class="fav-save-row" style="margin-top:8px">' +
            '<button type="button" class="btn btn-ghost btn-sm" id="updCheck">检测新版本</button></div>' +
            '<p class="tip" id="updStat">未检测</p>' +
            '<div class="modal-note" id="updLog" style="display:none;white-space:pre-line"></div>' +
            '<div class="fav-save-row" id="updActions" style="display:none">' +
            '<button type="button" class="btn btn-primary btn-sm" id="updDownload">下载新版</button>' +
            '<button type="button" class="btn btn-ghost btn-sm" id="updOnline">打开在线版</button>' +
            '<button type="button" class="btn btn-ghost btn-sm" id="updOpen">打开最新版页面</button></div>',
            '<button type="button" class="btn btn-ghost" data-close>关闭</button>');
        const inUrl = wrap.querySelector("#updUrl");
        const stat = wrap.querySelector("#updStat");
        const actions = wrap.querySelector("#updActions");
        let newer = null;   /* 检测到的新版信息 {ver,url,note} */
        try { inUrl.value = localStorage.getItem(UPDATE_URL_KEY) || ""; } catch (e) { /* 忽略 */ }
        function markBtn() {
            const b = document.getElementById("updateBtn");
            if (b) b.classList.add("has-new");
        }
        /* 检测到新版时的统一展示:版本号 + 更新内容面板 */
        function showFound() {
            stat.textContent = "发现新版本 v" + newer.ver + "(当前 v" + APP_VERSION + ")";
            const log = wrap.querySelector("#updLog");
            if (newer.note) {
                log.textContent = "【v" + newer.ver + " 更新内容】\n" + newer.note;
                log.style.display = "block";
            } else { log.style.display = "none"; }
            actions.style.display = "flex";
            markBtn();
        }
        if (updFound) { newer = updFound; showFound(); }   /* 页面加载时已静默发现过:直接展示,无需再点检测 */
        wrap.querySelector("#updCheck").onclick = function () {
            const url = inUrl.value.trim();
            if (url) { try { localStorage.setItem(UPDATE_URL_KEY, url); } catch (e) { /* 隐私模式忽略 */ } }
            stat.textContent = "正在检测…";
            actions.style.display = "none";
            /* version.json 可选提供更新说明;没建 / 被拦都不影响版本检测 */
            const noteP = updFetchText(VERJSON_URLS)
                .then(r => { try { const j = JSON.parse(r.t.trim()); return (j && j.note) ? String(j.note) : ""; } catch (e) { return ""; } })
                .catch(() => "");
            /* 自定义地址优先,全部失败时自动落到内置源 */
            Promise.all([updFetchText(url ? [url].concat(UPDATE_URLS) : UPDATE_URLS), noteP])
                .then(([res, note]) => {
                    const info = updParseVer(res.t);
                    if (!info) { stat.textContent = "已取到内容但解析不到版本号:HTML 里需含 APP_VERSION=\"x.y\",或改用 version.json"; return; }
                    if (updIsNewer(info.ver, APP_VERSION)) {
                        newer = { ver: info.ver, url: info.url || res.u, note: note || info.note || "" };
                        updFound = newer;
                        showFound();
                    } else {
                        newer = null;
                        stat.textContent = "已是最新版本(v" + APP_VERSION + ")";
                    }
                })
                .catch(() => {
                    stat.textContent = "读取失败:所有源地址均不可达(多为本机断网,或 CDN 域名被拦截,可换网络再试)";
                    newer = { ver: "?", url: url || UPDATE_URLS[0], note: "" };
                    actions.style.display = "flex";
                });
        };
        wrap.querySelector("#updOnline").onclick = function () {
            window.open(PAGE_URL, "_blank");
        };
        wrap.querySelector("#updOpen").onclick = function () {
            window.open(newer ? newer.url : (inUrl.value.trim() || UPDATE_URLS[0]), "_blank");
        };
        wrap.querySelector("#updDownload").onclick = function () {
            if (!newer) return;
            stat.textContent = "正在下载…";
            /* 下载与检测走同一套多镜像链路:单个镜像抖动 / 被拦时自动换源重试 */
            updFetchText((inUrl.value.trim() ? [inUrl.value.trim()] : []).concat(UPDATE_URLS))
                .then(res => {
                    const t = res.t;
                    /* 已知版本号时统一用具名文件(语雀等附件是哈希文件名,覆盖保存更直观) */
                    let name = "";
                    if (newer.ver === "?") {
                        try { name = decodeURIComponent(String(res.u).split("?")[0].split("/").pop() || ""); } catch (e) { /* 解码失败用默认名 */ }
                        if (!/\.(html?|json)$/i.test(name)) name = "";
                    }
                    if (!name) name = "云打印机命令工具 v" + (newer.ver !== "?" ? newer.ver : "new") + ".html";
                    const blob = new Blob([t], { type: "text/html;charset=utf-8" });
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = name;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
                    stat.textContent = "已开始下载「" + name + "」:请用新文件替换旧文件后重新打开(浏览器无法自动覆盖本地文件)";
                })
                .catch(() => {
                    /* 异步回调里 window.open 会被浏览器弹窗拦截,改为提示引导 */
                    stat.textContent = "下载失败:所有源均不可达。可点「打开在线版」直接用最新版,或稍后重试";
                });
        };
    }
    document.getElementById("updateBtn").onclick = openUpdateModal;
    /* 一键保存本地版:拉取最新在线版 html 存为本地文件,离线可用(在在线版页面里同样可用) */
    document.getElementById("saveLocalBtn").onclick = function () {
        const btn = this;
        const label = btn.lastChild;
        btn.disabled = true;
        label.nodeValue = "下载中…";
        updFetchText(UPDATE_URLS)
            .then(res => {
                const m = res.t.match(/APP_VERSION\s*=\s*"([\d\.]+)"/);
                const name = "云打印机命令工具 v" + (m ? m[1] : "new") + ".html";
                const blob = new Blob([res.t], { type: "text/html;charset=utf-8" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            })
            .catch(() => { alert("下载失败:所有源地址均不可达,请检查网络后重试"); })
            .finally(() => { btn.disabled = false; label.nodeValue = "下载本地版"; });
    };
    /* 分享手机版:二维码 + 链接复制(手机版布局里此按钮自动隐藏) */
    document.getElementById("shareBtn").onclick = function () {
        const mUrl = PAGE_URL + "?m=1";
        const wrap = openModal("分享手机版",
            '<p class="modal-note">手机扫码直接打开,或复制链接发给同事;手机版自动适配手机布局,功能完全一致</p>' +
            '<div id="qrShowBox"></div>' +
            '<div class="fav-save-row"><input type="text" id="shareUrl" readonly>' +
            '<button type="button" class="btn btn-ghost btn-sm" id="shareCopy">复制链接</button></div>',
            '<button type="button" class="btn btn-ghost" data-close>关闭</button>',
            "qr-modal");
        wrap.querySelector("#shareUrl").value = mUrl;
        const box = wrap.querySelector("#qrShowBox");
        if (typeof QRCode === "undefined") {
            box.innerHTML = '<p style="font-size:12px;color:#999;padding:30px 10px;">二维码组件未加载(需联网获取 CDN)</p>';
        } else {
            new QRCode(box, { text: mUrl, width: 200, height: 200 });
        }
        wrap.querySelector("#shareCopy").onclick = function () {
            const ok = () => alert("链接已复制,发给同事微信/QQ 即可");
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(mUrl).then(ok, function () { legacyCopy(mUrl, ok); });
            } else { legacyCopy(mUrl, ok); }
        };
    };
    /* 底部版本号:点开查看版本更新记录;手机版连点标题 5 次输管理密码,解锁打印机操作列 */
    document.getElementById("verFoot").onclick = function () {
        const rows = VER_HISTORY.map(v =>
            '<div class="ver-his-item"><b>v' + v[0] + '</b>' +
            (v[0] === APP_VERSION ? ' <span style="color:var(--ok);font-weight:700">当前</span>' : "") +
            "<br>" + v[1] + "</div>"
        ).join("");
        const wrap = openModal("版本更新记录", "<div>" + rows + "</div>",
            '<button type="button" class="btn btn-ghost" data-close>关闭</button>');
        /* 彩蛋式解锁:手机版下连点弹窗标题 5 次 → 输入管理密码 → 显示打印机操作列(本次有效) */
        let taps = 0;
        const h = wrap.querySelector(".modal-head h4");
        h.style.cursor = "pointer";
        h.onclick = function () {
            if (!document.body.classList.contains("mobile")) return;
            if (++taps < 5) return;
            taps = 0;
            wrap.remove();
            const pw = openModal("解锁打印机操作",
                '<p class="modal-note">请输入管理密码,解锁表格中的「打印机操作」列(本次打开有效,刷新后恢复隐藏)</p>' +
                '<input type="password" id="opsPass" placeholder="管理密码" autocomplete="off">',
                '<button type="button" class="btn btn-ghost" data-close>取消</button>' +
                '<button type="button" class="btn btn-primary" id="opsPassOk">解锁</button>');
            const inp = pw.querySelector("#opsPass");
            inp.focus();
            const tryUnlock = () => {
                if (inp.value === OPS_PASS) {
                    pw.remove();
                    document.body.classList.add("show-ops");
                    alert("已显示「打印机操作」列");
                } else {
                    alert("密码错误");
                    inp.value = "";
                    inp.focus();
                }
            };
            pw.querySelector("#opsPassOk").onclick = tryUnlock;
            inp.onkeydown = e => { if (e.key === "Enter") tryUnlock(); };
        };
    };
    /* 打开页面静默检测一次(未配置地址时走内置 GitHub 源):有新版只在按钮上亮点提示,不弹窗;同时取 version.json 的更新说明,打开弹窗直接展示 */
    (function updAuto() {
        let u = null;
        try { u = localStorage.getItem(UPDATE_URL_KEY); } catch (e) { /* 忽略 */ }
        const noteP = updFetchText(VERJSON_URLS)
            .then(r => { try { const j = JSON.parse(r.t.trim()); return (j && j.note) ? String(j.note) : ""; } catch (e) { return ""; } })
            .catch(() => "");
        Promise.all([updFetchText((u ? [u] : []).concat(UPDATE_URLS)), noteP])
            .then(([res, note]) => {
                const info = updParseVer(res.t);
                if (info && updIsNewer(info.ver, APP_VERSION)) {
                    updFound = { ver: info.ver, url: info.url || res.u, note: note || info.note || "" };
                    document.getElementById("updateBtn").classList.add("has-new");
                }
            })
            .catch(() => { /* 静默失败,不打扰 */ });
    })();
    /* 云端公告:拉取 notice.txt(多镜像),有内容则在页顶显示,可关闭;无公告 / 断网时静默 */
    (function noticeInit() {
        updFetchText(NOTICE_URLS)
            .then(res => {
                const txt = res.t.trim();
                if (!txt) return;
                const wrap = document.getElementById("noticeWrap");
                const bar = document.createElement("div");
                bar.className = "notice-bar";
                const ic = document.createElement("span");
                ic.className = "n-ic";
                ic.textContent = "📢";
                const tx = document.createElement("span");
                tx.className = "n-txt";
                tx.textContent = txt.length > 500 ? txt.slice(0, 500) + "…" : txt;
                const x = document.createElement("button");
                x.type = "button";
                x.className = "n-x";
                x.title = "关闭公告";
                x.textContent = "×";
                x.onclick = () => { wrap.style.display = "none"; };
                bar.appendChild(ic);
                bar.appendChild(tx);
                bar.appendChild(x);
                wrap.textContent = "";
                wrap.appendChild(bar);
                wrap.style.display = "block";
            })
            .catch(() => { /* 静默:无公告或网络不通 */ });
    })();
</script>
<script>
    /* ========== 批量查询(并发版) ========== */
    const QR_SM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v.01"/></svg>';
    const OPS_SM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7" rx="1"/></svg>';
    const COPY_SM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    const CSV_SM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>';

    async function apiCall(apiKey, params) {
        try {
            const resp = await postForm(printer_url, { apiKey, secretId, secretKey, ...params });
            return { ok: true, data: resp };
        } catch (err) {
            return { ok: false, msg: (err && err.message) || "网络异常" };
        }
    }
    async function queryOneDevice(devId) {
        /* 打印机状态中文映射 + 徽章配色 */
        const printStatuses = {
            "-1": ["其他异常", "pill-err"],
            "1": ["正常", "pill-ok"],
            "2": ["缺纸", "pill-warn"],
            "3": ["开盖", "pill-err"]
        };
        const mapConn = ["以太网", "预留", "GPRS", "WIFI", "4G", "5G"];
        let resultItem = {
            devId: devId, connMode: "—", version: "—", ip: "—",
            printerStatusText: "—", printerCss: "",
            networkStatusText: "—", networkCss: "", errMsg: ""
        };
        const r1 = await apiCall("ec-printer-device-mqttInfo", { deviceId: devId });
        if (!r1.ok) { resultItem.errMsg = r1.msg; return resultItem; }
        if (!r1.data.data) { resultItem.errMsg = r1.data?.msg || "无状态返回"; return resultItem; }
        /* 网络状态翻译 + 配色 */
        const mqttStatus = r1.data.data.status;
        if (mqttStatus === "ONLINE")      { resultItem.networkStatusText = "在线";     resultItem.networkCss = "pill-ok"; }
        else if (mqttStatus === "OFFLINE")   { resultItem.networkStatusText = "离线";     resultItem.networkCss = "pill-err"; }
        else if (mqttStatus === "INACTIVE")  { resultItem.networkStatusText = "从未上线"; resultItem.networkCss = "pill-gray"; }
        else                               { resultItem.networkStatusText = mqttStatus;  resultItem.networkCss = ""; }
        const r2 = await apiCall("ec-printer-device-properties", { deviceId: devId, serviceId: "DeviceInfo" });
        if (r2.ok && r2.data?.data) {
            const shadow = r2.data.data;
            resultItem.version = shadow.version || "—";
            resultItem.connMode = mapConn[shadow.connectionMode] || "未知网络";
            resultItem.ip = shadow.ip || "—";
            const ps = printStatuses[String(shadow.printStatus)] || ["未知打印状态", "pill-gray"];
            resultItem.printerStatusText = ps[0];
            resultItem.printerCss = ps[1];
        }
        return resultItem;
    }
    function cell(text, cls) {
        const td = document.createElement("td");
        if (cls) td.className = cls;
        if (text !== undefined && text !== null) td.textContent = text;
        return td;
    }
    function statusPill(text, cls) {
        if (!cls) return document.createTextNode(text || "—");
        const s = document.createElement("span");
        s.className = "pill " + cls;
        s.textContent = text;
        return s;
    }
    function buildResultRow(item) {
        const tr = document.createElement("tr");
        tr.dataset.devid = item.devId;
        /* 设备ID单元格:点击一键复制 */
        const tdDev = document.createElement("td");
        tdDev.className = "dev-cell dev-copy";
        tdDev.title = "点击复制设备ID";
        tdDev.tabIndex = 0;
        tdDev.setAttribute("role", "button");
        const idSpan = document.createElement("span");
        idSpan.className = "dev-id-text";
        idSpan.textContent = item.devId;
        tdDev.appendChild(idSpan);
        tdDev.insertAdjacentHTML("beforeend", COPY_SM_ICON);
        const copyTrigger = ev => { ev.stopPropagation(); copyDeviceId(item.devId, idSpan); };
        tdDev.onclick = copyTrigger;
        tdDev.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); copyTrigger(e); } };
        tr.appendChild(tdDev);
        /* 配网二维码按钮 */
        const tdQr = cell();
        const btn = document.createElement("span");
        btn.className = "qrcode-text-btn";
        btn.setAttribute("role", "button");
        btn.tabIndex = 0;
        btn.innerHTML = QR_SM_ICON;
        btn.appendChild(document.createTextNode("配网二维码"));
        const trigger = ev => { ev.stopPropagation(); openCardQrModal(item.devId); };
        btn.onclick = trigger;
        btn.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); trigger(e); } };
        tdQr.appendChild(btn);
        tr.appendChild(tdQr);
        if (item.errMsg) {
            tr.classList.add("err-row");
            const tdErr = cell("错误:" + item.errMsg, "err-text");
            tdErr.colSpan = 5;
            tr.appendChild(tdErr);
        } else {
            tr.appendChild(cell(item.connMode));
            tr.appendChild(cell(item.version, "cell-mono"));
            tr.appendChild(cell(item.ip, "cell-mono"));
            /* N617L / N536L / Y626 前缀:云端无打印状态数据,该列不显示 */
            if (noPrintStatus(item.devId)) {
                tr.appendChild(cell("—", "cell-dim"));
            } else {
                const tdPs = cell();
                tdPs.appendChild(statusPill(item.printerStatusText, item.printerCss));
                tr.appendChild(tdPs);
            }
            const tdNs = cell();
            tdNs.appendChild(statusPill(item.networkStatusText, item.networkCss));
            tr.appendChild(tdNs);
        }
        tr.appendChild(buildOpsCell(item.devId)); /* 打印机操作列 */
        return tr;
    }
    async function batchQueryDevices() {
        const container = document.getElementById("batchResult");
        container.innerHTML = "";
        const devList = document.getElementById("multiDeviceInput").value
            .split(/\r?\n/).map(i => i.trim()).filter(i => i.length > 0);
        if (devList.length === 0) { alert("请填写至少一个设备ID"); return; }
        if (!ensureCreds()) return;   /* 未配置凭据:弹输入框并拦下本次查询 */
        showLoading(true);
        try {
            /* 并发查询,保持输入顺序(原串行逐台 await,设备多时极慢) */
            const items = await Promise.all(devList.map(d => queryOneDevice(d)));
            lastQueryItems = items;   /* 供 CSV 导出使用 */
            lastQueryTime = new Date();
            const tableWrap = document.createElement("div");
            tableWrap.className = "table-wrap";
            const table = document.createElement("table");
            table.className = "result-table";
            const thead = document.createElement("thead");
            const trHead = document.createElement("tr");
            ["设备ID", "配网二维码", "联网方式", "固件版本", "IP地址", "打印机状态", "网络状态", "打印机操作"].forEach(txt => {
                const th = document.createElement("th");
                th.textContent = txt;
                if (txt === "打印机操作") th.className = "ops-col";   /* 手机版默认隐藏此列 */
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);
            table.appendChild(thead);
            const tbody = document.createElement("tbody");
            items.forEach(item => tbody.appendChild(buildResultRow(item)));
            table.appendChild(tbody);
            tableWrap.appendChild(table);
            container.appendChild(tableWrap);
            const okCount = items.filter(i => !i.errMsg).length;
            const onlineCount = items.filter(i => i.networkStatusText === "在线").length;
            const sumRow = document.createElement("div");
            sumRow.className = "sum-row";
            const sum = document.createElement("p");
            sum.className = "batch-summary";
            sum.textContent = "共查询 " + items.length + " 台 · 成功 " + okCount + " 台 · 在线 " + onlineCount + " 台";
            sumRow.appendChild(sum);
            const btnExport = document.createElement("button");
            btnExport.type = "button";
            btnExport.className = "btn btn-ghost btn-sm";
            btnExport.innerHTML = CSV_SM_ICON;
            btnExport.appendChild(document.createTextNode("导出 CSV 报告"));
            btnExport.onclick = exportQueryCsv;
            sumRow.appendChild(btnExport);
            container.appendChild(sumRow);
            /* 设备ID单元格自带一键复制,无需整行点击行为 */
        } catch (e) {
            const p = document.createElement("p");
            p.style.cssText = "color:#dc2626;font-size:13px;margin-top:12px;";
            p.textContent = "查询异常:" + ((e && e.message) || e);
            container.appendChild(p);
        } finally {
            showLoading(false);
        }
    }
    /* ========== 查询结果导出 CSV(概况 + 异常清单 + 全量明细,Excel 可直接打开) ========== */
    let lastQueryItems = null;
    let lastQueryTime = null;
    function csvCell(v) {
        return '"' + String(v === undefined || v === null ? "" : v).replace(/"/g, '""') + '"';
    }
    /* 异常判定:查询失败 / 离线 / 从未上线 / 缺纸 / 开盖 / 其他异常 */
    function abnormalTypeOf(item) {
        if (item.errMsg) return "查询失败";
        if (item.networkStatusText === "离线") return "离线";
        if (item.networkStatusText === "从未上线") return "从未上线";
        if (!noPrintStatus(item.devId) && ["缺纸", "开盖", "其他异常"].indexOf(item.printerStatusText) >= 0) {
            return item.printerStatusText;
        }
        return null;
    }
    function exportQueryCsv() {
        if (!lastQueryItems || !lastQueryItems.length) { alert("请先执行批量查询"); return; }
        const items = lastQueryItems;
        const okItems = items.filter(i => !i.errMsg);
        const online = okItems.filter(i => i.networkStatusText === "在线").length;
        const offline = okItems.filter(i => i.networkStatusText === "离线").length;
        const inactive = okItems.filter(i => i.networkStatusText === "从未上线").length;
        const rate = okItems.length ? (online / okItems.length * 100).toFixed(1) : "0.0";
        const abnormals = items.filter(i => abnormalTypeOf(i) !== null);
        const d = lastQueryTime || new Date();
        const p2 = n => String(n).padStart(2, "0");
        const timeText = d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) + " " +
            p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
        const stamp = d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + "_" +
            p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds());
        const L = [];
        L.push("云打印设备查询报告");
        L.push("");
        L.push("查询时间," + csvCell(timeText));
        L.push("设备总数," + items.length + ",查询成功," + okItems.length + ",查询失败," + (items.length - okItems.length));
        L.push("在线," + online + ",离线," + offline + ",从未上线," + inactive + ",在线率," + rate + "%");
        L.push("异常设备," + abnormals.length + " 台(含离线 / 从未上线 / 缺纸 / 开盖 / 其他异常 / 查询失败)");
        L.push("");
        L.push("一、异常设备清单");
        L.push("设备ID,异常类型,网络状态,打印机状态,固件版本,IP地址,备注");
        if (abnormals.length === 0) {
            L.push("(无异常设备)");
        } else {
            abnormals.forEach(i => {
                const ps = noPrintStatus(i.devId) ? "—" : (i.printerStatusText || "—");
                L.push([csvCell(i.devId), csvCell(abnormalTypeOf(i)), csvCell(i.errMsg ? "—" : i.networkStatusText),
                    csvCell(ps), csvCell(i.errMsg ? "—" : i.version), csvCell(i.errMsg ? "—" : i.ip),
                    csvCell(i.errMsg ? "错误:" + i.errMsg : "")].join(","));
            });
        }
        L.push("");
        L.push("二、全部设备明细");
        L.push("设备ID,联网方式,固件版本,IP地址,打印机状态,网络状态,备注");
        items.forEach(i => {
            const ps = noPrintStatus(i.devId) ? "—" : (i.printerStatusText || "—");
            L.push([csvCell(i.devId), csvCell(i.errMsg ? "—" : i.connMode), csvCell(i.errMsg ? "—" : i.version),
                csvCell(i.errMsg ? "—" : i.ip), csvCell(ps), csvCell(i.errMsg ? "—" : i.networkStatusText),
                csvCell(i.errMsg ? "错误:" + i.errMsg : "")].join(","));
        });
        /* ﻿ BOM:确保 Excel 识别 UTF-8 中文不乱码 */
        const blob = new Blob(["﻿" + L.join("\r\n")], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "打印设备查询报告_" + stamp + ".csv";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    /* ========== 行内打印机操作(仅 XY58B / XY58C / EC 前缀设备显示) ========== */
    const OPS_ICON = {
        restart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>',
        wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="M2 8.8a16 16 0 0 1 20 0"/></svg>',
        receipt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18l-2.3-1.6L14.4 21 12 19.4 9.6 21l-2.3-1.6L5 21z"/><path d="M9 8h6"/><path d="M9 12h6"/></svg>',

        droplet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7s6.5 6.6 6.5 11a6.5 6.5 0 1 1-13 0c0-4.4 6.5-11 6.5-11z"/></svg>',
        gauge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>',
        upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>',

        type: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>',
        layout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>',
        qrcodeic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v.01"/></svg>',
        image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>',
        terminal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>'
    };
    /* N617L / N536L / Y626 前缀设备不显示打印机状态列内容 */
    function noPrintStatus(devId) {
        const up = String(devId).replace(/\s/g, "").toUpperCase();
        return up.startsWith("N617L") || up.startsWith("N536L") || up.startsWith("Y626");
    }
    /* 设备ID一键复制(clipboard API 优先,失败回退 execCommand) */
    function copyDeviceId(devId, span) {
        const done = () => {
            const prev = span.textContent;
            span.textContent = "已复制";
            const td = span.closest("td");
            if (td) td.classList.add("copied");
            setTimeout(function () {
                span.textContent = prev;
                if (td) td.classList.remove("copied");
            }, 1200);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(devId).then(done, function () { legacyCopy(devId, done); });
        } else {
            legacyCopy(devId, done);
        }
    }
    /* 是否支持行内操作:XY58B / XY58C / EC 前缀(不区分大小写) */
    function supportsOps(devId) {
        const up = String(devId).replace(/\s/g, "").toUpperCase();
        return up.startsWith("XY58B") || up.startsWith("XY58C") || up.startsWith("EC");
    }
    function buildOpsCell(devId) {
        const td = cell("", "cell-dim ops-col");
        if (!supportsOps(devId)) {
            td.textContent = "—";
            return td;
        }
        const btn = document.createElement("span");
        btn.className = "qrcode-text-btn";
        btn.setAttribute("role", "button");
        btn.tabIndex = 0;
        btn.innerHTML = OPS_SM_ICON;
        btn.appendChild(document.createTextNode("打印机操作"));
        const trigger = ev => { ev.stopPropagation(); openOpsModal(devId); };
        btn.onclick = trigger;
        btn.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); trigger(e); } };
        td.appendChild(btn);
        return td;
    }
    /* 给当前弹窗加「← 返回」按钮:回到打印机操作菜单(已存在则不重复加) */
    function opsBackBtn(devId) {
        const wrap = document.querySelector(".modal-wrap");
        const head = wrap && wrap.querySelector(".modal-head");
        if (!head || head.querySelector(".modal-back")) return;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "modal-back";
        b.textContent = "← 返回";
        b.onclick = () => { wrap.remove(); openOpsModal(devId); };
        head.insertBefore(b, head.firstChild);
    }
    /* 行内操作弹窗:设备操作 + 内容打印两组,浓度 / 速度仅 EC 前缀显示 */
    function openOpsModal(devId) {
        const isEc = String(devId).replace(/\s/g, "").toUpperCase().startsWith("EC");
        const wrap = openModal("打印机专属操作",
            '<p class="qr-dev"></p>' +
            '<p class="modal-note">以下操作将直接下发至该设备</p>' +
            '<p class="ops-group">设备操作</p>' +
            '<div class="op-grid modal-ops" id="opsGrid"></div>' +
            '<p class="ops-group">自定义内容打印</p>' +
            '<div class="op-grid modal-ops" id="contentGrid"></div>',
            '<button type="button" class="btn btn-ghost" data-close>关闭</button>');
        wrap.querySelector(".qr-dev").textContent = "设备编号:" + devId;
        const addOp = (sel, op) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "op-btn " + op.cls;
            b.innerHTML = OPS_ICON[op.icon];
            b.appendChild(document.createTextNode(op.label));
            b.onclick = () => { wrap.remove(); op.run(); opsBackBtn(devId); };
            wrap.querySelector(sel).appendChild(b);
        };
        [
            { icon: "restart", cls: "op-amber",  label: "重启打印机",    show: true, run: () => executeCommand("RESTART", {}, devId) },
            { icon: "wifi",    cls: "op-sky",    label: "更换网络配置",  show: true, run: () => promptSwitch(devId) },
            { icon: "receipt", cls: "op-green",  label: "打印测试小票",  show: true, run: () => printTicket(devId) },
            { icon: "tag",     cls: "op-teal",   label: "打印测试条码",  show: true, run: () => printBarcode(devId) },
            { icon: "droplet", cls: "op-violet", label: "54云/YK-58R云改打印浓度", show: isEc, run: () => openDensityModal(devId) },
            { icon: "gauge",   cls: "op-violet", label: "54云/YK-58R云改打印速度", show: isEc, run: () => openSpeedModal(devId) },
            { icon: "upload",  cls: "op-indigo", label: "固件文件升级",  show: true, run: () => upgradeFirmware(devId) },
            { icon: "link",    cls: "op-indigo", label: "固件链接升级",  show: true, run: () => upgradeFirmwareUrl(devId) }
        ].forEach(op => { if (op.show) addOp("#opsGrid", op); });
        [
            { icon: "type",     cls: "op-sky",    label: "任意文本打印",    run: () => printTextModal(devId) },
            { icon: "layout",   cls: "op-green",  label: "小票编辑·行级",   run: () => printLinesModal(devId) },
            { icon: "receipt",  cls: "op-amber",  label: "商品清单小票",    run: () => printItemsModal(devId) },
            { icon: "qrcodeic", cls: "op-teal",   label: "条码/二维码标签", run: () => printLabelModal(devId) },
            { icon: "tag",      cls: "op-indigo", label: "批量条码/二维码", run: () => printBatchLabelModal(devId) },
            { icon: "image",    cls: "op-indigo", label: "图片打印",        run: () => printImageModal(devId) },
            { icon: "terminal", cls: "op-violet", label: "自定义指令·本地收藏", run: () => customCmdModal(devId) }
        ].forEach(op => addOp("#contentGrid", op));
    }

    /* 配网二维码弹窗(URL 以 textContent 写入,修复拼接注入隐患) */
    function openCardQrModal(devId) {
        const cleanDevId = devId.replace(/\s/g, "");
        const devUp = cleanDevId.toUpperCase();
        let qrUrl = null;
        if (devUp.startsWith("N617") || devUp.startsWith("N536")) {
            qrUrl = "https://yk1.co/wifi?s=260123&m=SC01&d=" + encodeURIComponent(cleanDevId);
        } else if (devUp.startsWith("Y626")) {
            qrUrl = "https://yk1.co/wifi?s=260123&m=SC02&d=" + encodeURIComponent(cleanDevId);
        } else if (devUp.startsWith("XY58B") || devUp.startsWith("XY58C")) {
            qrUrl = "https://yk1.co/wifi?s=2503123199&d=" + encodeURIComponent(cleanDevId) + "&m=YK-58C";
        } else if (devUp.startsWith("EC")) {
            qrUrl = "https://yk1.co/wifi?s=2503123199&d=" + encodeURIComponent(cleanDevId) + "&m=YK-58yunR";
        } else {
            alert("该设备ID前缀不支持生成配网二维码!");
            return;
        }
        const wrap = openModal("配网二维码",
            '<p class="qr-dev"></p><p class="qr-url"></p><div id="qrShowBox"></div>',
            '<button type="button" class="btn btn-ghost" data-close>关闭</button>',
            "qr-modal");
        wrap.querySelector(".qr-dev").textContent = "设备编号:" + cleanDevId;
        wrap.querySelector(".qr-url").textContent = qrUrl;
        const box = wrap.querySelector("#qrShowBox");
        if (typeof QRCode === "undefined") {
            box.innerHTML = '<p style="font-size:12px;color:#999;padding:30px 10px;">二维码组件未加载(需联网获取 CDN)</p>';
        } else {
            new QRCode(box, { text: qrUrl, width: 220, height: 220 });
        }
    }

    /* 批量查询输入框:宽度随最长行内容自动调节(240–560px) */
    (function autoFitQueryInput() {
        const ta = document.getElementById("multiDeviceInput");
        const mirror = document.createElement("span");
        mirror.style.cssText = "position:absolute;visibility:hidden;white-space:pre;top:-9999px;left:-9999px;";
        document.body.appendChild(mirror);
        function fit() {
            mirror.style.font = getComputedStyle(ta).font;
            let widest = "设备编号示例 XY58B5084003"; /* 空内容时的基准宽度 */
            const val = ta.value;
            if (val) {
                val.split(/\r?\n/).forEach(line => { if (line.length > widest.length) widest = line; });
            }
            mirror.textContent = widest + "00"; /* 留光标余量 */
            const max = Math.min(560, window.innerWidth - 48);
            ta.style.width = Math.max(240, Math.min(mirror.offsetWidth + 28, max)) + "px";
        }
        ta.addEventListener("input", fit);
        window.addEventListener("resize", fit);
        fit();
    })();

    /* ========== 自动刷新:每 N 分钟自动重查输入框内设备(默认 30 分钟;仅静默刷新,无通知 / 声音) ========== */
    const AR_KEY = "YK_AUTOREFRESH";
    let arRemain = 0, arTick = null, arQuerying = false;
    const arChk = document.getElementById("autoRefreshChk");
    const arMin = document.getElementById("autoRefreshMin");
    const arStat = document.getElementById("autoRefreshStat");
    function arSave() {
        try { localStorage.setItem(AR_KEY, JSON.stringify({ on: arChk.checked, min: Number(arMin.value) || 30 })); } catch (e) { /* 隐私模式忽略 */ }
    }
    function arShowStat() {
        arStat.textContent = arChk.checked
            ? "下次刷新 " + Math.floor(arRemain / 60) + ":" + String(arRemain % 60).padStart(2, "0")
            : "";
    }
    function arReset() {
        arRemain = Math.max(1, Number(arMin.value) || 30) * 60;
        arShowStat();
    }
    function arStop() {
        if (arTick) { clearInterval(arTick); arTick = null; }
        arRemain = 0;
        arStat.textContent = "";
    }
    function arStart() {
        arStop();
        arSave();
        if (!arChk.checked) return;
        arReset();
        arTick = setInterval(function () {
            arRemain--;
            if (arRemain <= 0) {
                arReset();
                /* 到点:静默重查一遍当前输入框内的设备;输入为空或上一轮未完成时跳过 */
                const devs = document.getElementById("multiDeviceInput").value
                    .split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);
                if (!devs.length || arQuerying) return;
                arQuerying = true;
                Promise.resolve(batchQueryDevices()).finally(function () { arQuerying = false; });
            } else {
                arShowStat();
            }
        }, 1000);
    }
    arChk.addEventListener("change", arStart);
    arMin.addEventListener("change", function () {
        arMin.value = Math.max(1, Math.min(720, Number(arMin.value) || 30));
        if (arChk.checked) arReset();
        arSave();
    });
    (function arRestore() {
        let cfg = null;
        try { cfg = JSON.parse(localStorage.getItem(AR_KEY) || "null"); } catch (e) { /* 忽略损坏数据 */ }
        if (cfg && cfg.min) arMin.value = Math.max(1, Math.min(720, Number(cfg.min) || 30));
        if (cfg && cfg.on) { arChk.checked = true; arStart(); }
    })();
</script>
<script>
    /* ========== 打印机命令下发(由查询表格「打印机操作」弹窗调用) ========== */
    function executeCommand(cmd, params, deviceId) {
        params = params || {};
        const devId = String(deviceId || "").trim();
        if (!devId) { alert("缺少设备编号,请从查询表格行内发起操作"); return; }
        if (!ensureCreds()) return;   /* 未配置凭据:弹输入框并拦下本次操作 */
        params.globalId = String(Date.now());
        showLoading(true);
        postForm(printer_url, {
            apiKey: "ec-printer-control-command-send",
            secretId: secretId,
            secretKey: secretKey,
            deviceId: devId,
            commandName: cmd,
            paras: JSON.stringify(params)
        })
        .then(data => renderRes(data && data.data ? data.data : data))
        .catch(() => showResError("执行失败:请求未发出或网络异常"))
        .finally(() => showLoading(false));
    }
    /* 更换网络配置:弹窗表单替代原 prompt()(原逻辑在取消密码时会静默无响应) */
    function promptSwitch(deviceId) {
        const devId = String(deviceId || "").trim();
        if (!devId) { alert("缺少设备编号,请从查询表格行内发起操作"); return; }
        const wrap = openModal("更换网络配置",
            '<label for="wifiSsid">WiFi 名称(SSID)</label>' +
            '<input type="text" id="wifiSsid" placeholder="例如:Office-2.4G" autocomplete="off">' +
            '<label for="wifiPsk">WiFi 密码</label>' +
            '<input type="text" id="wifiPsk" placeholder="WiFi 密码" autocomplete="off">',
            '<button type="button" class="btn btn-ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn-primary" id="wifiOk">确认下发</button>');
        const ssidInput = wrap.querySelector("#wifiSsid");
        ssidInput.focus();
        wrap.querySelector("#wifiOk").onclick = function () {
            const ssid = ssidInput.value.trim();
            const psk = wrap.querySelector("#wifiPsk").value;
            if (!ssid) { alert("请输入 WiFi 名称"); return; }

<script>
    /* ========== 内容打印工具:任意文本 / 小票模板 / 条码二维码 / 图片 / 自定义指令 ========== */
    /* GBK 编码适配:优先使用 gbk.js(CDN,带 unpkg 兜底);未加载时仅支持英文数字 */
    function gbkEncodeBytes(s) {
        if (window.GBK && typeof GBK.encode === "function") {
            try {
                const r = GBK.encode(s);
                if (typeof r === "string") { return Array.from(r, ch => ch.charCodeAt(0) & 0xFF); }
                if (r && typeof r.length === "number") { return Array.from(r, b => Number(b) & 0xFF); }
            } catch (e) { /* 编码失败按未加载处理 */ }
        }
        return null;
    }
    /* 行文本 → 字节:ASCII 直接转码,含中文时走 GBK;无法编码返回 null */
    function encodePrintLine(s) {
        const out = [];
        for (const ch of s) {
            const c = ch.codePointAt(0);
            if (c < 0x80) { out.push(c); }
            else {
                const gb = gbkEncodeBytes(ch);
                if (!gb) return null;
                gb.forEach(b => out.push(b));
            }
        }
        return out;
    }
    function bytesToHexSpaced(bytes) {
        return bytes.map(b => (b & 0xFF).toString(16).padStart(2, "0").toUpperCase()).join(" ") + " ";
    }
    /* ESC/POS 文本指令:初始化 + 对齐 + 加粗/倍大 + 逐行内容 + 走纸/切刀 */
    function buildTextHex(text, opts) {
        const encoded = text.split(/\r?\n/).map(l => encodePrintLine(l));
        if (encoded.some(e => e === null)) return null;
        const bytes = [0x1B, 0x40, 0x1B, 0x61, opts.align];
        if (opts.bold) bytes.push(0x1B, 0x45, 1);
        if (opts.big) bytes.push(0x1D, 0x21, 0x11);
        encoded.forEach(e => { e.forEach(b => bytes.push(b)); bytes.push(0x0A); });
        if (opts.bold) bytes.push(0x1B, 0x45, 0);
        if (opts.big) bytes.push(0x1D, 0x21, 0x00);
        for (let i = 0; i < (opts.feed || 0); i++) bytes.push(0x0A);
        if (opts.cut) bytes.push(0x1D, 0x56, 0x00);
        return bytesToHexSpaced(bytes);
    }
    function pad2Fn(n) { return String(n).padStart(2, "0"); }
    function nowText() {
        const d = new Date();
        return d.getFullYear() + "-" + pad2Fn(d.getMonth() + 1) + "-" + pad2Fn(d.getDate()) + " " +
            pad2Fn(d.getHours()) + ":" + pad2Fn(d.getMinutes()) + ":" + pad2Fn(d.getSeconds());
    }

    /* ---------- 1. 任意文本打印 ---------- */
    function printTextModal(deviceId) {
        const devId = String(deviceId || "").trim();

            '<textarea id="printTextInput" rows="4" placeholder="第一行…&#10;第二行…" spellcheck="false"></textarea>' +
            '<div class="chips">' +
            '<label class="chip-opt"><input type="radio" name="textAlign" value="0" checked><span>左对齐</span></label>' +
            '<label class="chip-opt"><input type="radio" name="textAlign" value="1"><span>居中</span></label>' +
            '<label class="chip-opt"><input type="radio" name="textAlign" value="2"><span>右对齐</span></label>' +
            "</div>" +
            '<label class="chk"><input type="checkbox" id="textBold"> 加粗</label>' +
            '<label class="chk"><input type="checkbox" id="textBig"> 倍大字号</label>' +
