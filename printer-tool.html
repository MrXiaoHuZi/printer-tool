            '<button type="button" class="btn btn-ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn-primary" id="textOk">确认打印</button>');
        const ta = wrap.querySelector("#printTextInput");
        const taCmd = wrap.querySelector("#textCmd");
        function refresh() {
            if (!ta.value.trim()) { taCmd.value = ""; return; }
            const hex = buildTextHex(ta.value, {
                align: Number(wrap.querySelector('input[name="textAlign"]:checked').value),
                bold: wrap.querySelector("#textBold").checked,
                big: wrap.querySelector("#textBig").checked,
                cut: wrap.querySelector("#textCut").checked,
                feed: Math.max(0, Math.min(20, Number(wrap.querySelector("#textFeed").value) || 0))
            });
            taCmd.value = hex === null ? "(中文编码组件未加载:当前仅支持英文 / 数字)" : hex;
        }
        ta.addEventListener("input", refresh);
        ["input", "change"].forEach(evt => {
            wrap.querySelectorAll('input[name="textAlign"],#textBold,#textBig,#textCut,#textFeed').forEach(el => {
                el.addEventListener(evt, refresh);
            });
        });
        refresh();
        wrap.querySelector("#textOk").onclick = function () {
            const cmd = taCmd.value;
            if (!cmd || cmd[0] === "(") { alert("指令为空或中文编码组件未加载"); return; }
            wrap.remove();
            sendHexCmd(devId, cmd);
        };
    }

    /* ---------- 2. 行级小票编辑器 + 商品清单 + 批量条码二维码 ---------- */
    /* 条码内容校验(单张标签 / 批量打印共用) */
    function codeDataErr(type, data) {
        if (!data) return "请输入打印内容";
        if (type === "code128" && /[^\x20-\x7E]/.test(data)) return "CODE128 仅支持英文 / 数字 / 常用符号";
        if (type === "code39" && !/^[0-9A-Za-z\-\.\$\/\+\% ]+$/.test(data)) return "CODE39 仅支持字母 / 数字 / - . $ / + % 空格";
        if (type === "ean13" && !/^\d{12,13}$/.test(data)) return "EAN13 需要 12-13 位数字";
        return "";
    }
    /* ESC/POS 条码 / 二维码指令段(单张标签 / 批量打印共用);写入 bytes,失败返回 false */
    function escposPushCode(bytes, type, data, o) {
        o = o || {};
        if (type === "qr") {
            /* 标准 GS ( k 49 系列:模型2 → 模块大小 → 纠错M → 存数据 → 打印 */
            const e = encodePrintLine(data);
            if (e === null) return false;
            const mag = Math.max(3, Math.min(8, o.mag || 5));
            const len = e.length + 3;
            bytes.push(0x1D, 0x28, 0x6B, 0x04, 0x00, 0x31, 0x50, 0x32, 0x00);
            bytes.push(0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x43, mag);
            bytes.push(0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x45, 0x4D);
            bytes.push(0x1D, 0x28, 0x6B, len & 0xFF, (len >> 8) & 0xFF, 0x31, 0x50);
            e.forEach(b => bytes.push(b));
            bytes.push(0x1D, 0x28, 0x6B, 0x03, 0x00, 0x31, 0x51, 0x30);
        } else {
            /* GS k 功能B:ean13=67 / code39=69 / code128=73;CODE128 数据需 {B 编码集前缀 */
            const bh = Math.max(40, Math.min(240, o.bh || 96));
            let m, sendData;
            if (type === "ean13") { m = 0x43; sendData = data; }
            else if (type === "code39") { m = 0x45; sendData = data.toUpperCase(); }
            else { m = 0x49; sendData = "{B" + data; }
            const e = Array.from(sendData, ch => ch.charCodeAt(0) & 0xFF);
            bytes.push(0x1D, 0x68, bh);                                   /* 条码高度(点) */
            bytes.push(0x1D, 0x77, Math.max(2, Math.min(6, o.narrow || 2))); /* 窄条宽度(点) */
            bytes.push(0x1D, 0x48, 0x02);                                 /* HRI 字符印在条码下方 */
            bytes.push(0x1D, 0x6B, m, e.length);
            e.forEach(b => bytes.push(b));
        }
        return true;
    }
    /* GS !(1D 21)字号:1-4 倍 → 00/11/22/33 */
    const sizeByteFn = k => ((((k || 1) - 1) << 4) | ((k || 1) - 1)) & 0xFF;

    /* ---------- 2a. 行级小票编辑器(每行独立对齐 / 加粗 / 字号,↑↓ 调顺序,可存模板) ---------- */
    const TPL_FAV_KEY = "YK_TPL_FAV";
    function loadTplFavs() { try { return JSON.parse(localStorage.getItem(TPL_FAV_KEY) || "[]"); } catch (e) { return []; } }
    function saveTplFavs(l) { try { localStorage.setItem(TPL_FAV_KEY, JSON.stringify(l)); } catch (e) { /* 隐私模式忽略 */ } }
    function printLinesModal(deviceId) {
        const devId = String(deviceId || "").trim();
        if (!devId) { alert("缺少设备编号,请从查询表格行内发起操作"); return; }
        const wrap = openModal("小票编辑器(行级)",
            '<p class="modal-note">每行独立设置对齐 / 加粗 / 字号,↑↓ 调整行顺序;参数可存为模板复用</p>' +
            '<div class="chips">' +
            '<label class="chip-opt"><input type="radio" name="linePaper" value="58" checked><span>58mm</span></label>' +
            '<label class="chip-opt"><input type="radio" name="linePaper" value="110"><span>110mm</span></label>' +
            "</div>" +
            '<p class="ops-group">内容行(从上到下依次打印)</p>' +
            '<div id="lineList"></div>' +
            '<button type="button" class="btn btn-ghost btn-sm" id="lineAdd">+ 添加一行</button>' +
            '<label class="chk"><input type="checkbox" id="lineCut"> 打印后切刀</label>' +
            "<label for=\"lineFeed\">打印后走纸行数</label>" +
            '<input type="number" id="lineFeed" value="3" min="0" max="20">' +
            '<p class="ops-group">模板收藏(本机保存,最多 30 条)</p>' +
            '<div class="fav-save-row"><input type="text" id="tplFavName" placeholder="模板名称,如:堂食小票" autocomplete="off">' +
            '<button type="button" class="btn btn-ghost btn-sm" id="tplFavSave">保存</button></div>' +
            '<div id="tplFavList"></div>' +
            "<label>预览(只读)</label>" +
            '<textarea id="linePreview" readonly rows="10" spellcheck="false"></textarea>',
            '<button type="button" class="btn btn-ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn-primary" id="lineOk">确认打印</button>');
        /* 行数据:t=文字 a=对齐(0左1中2右) b=加粗 s=字号1-4 */
        let lines = [
            { t: "", a: 1, b: true, s: 2 },
            { t: "", a: 0, b: false, s: 1 },
            { t: "", a: 0, b: false, s: 1 }
        ];
        const listEl = wrap.querySelector("#lineList");
        const taPreview = wrap.querySelector("#linePreview");
        function miniBtn(txt, fn) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "mini-btn";
            b.textContent = txt;
            b.onclick = fn;
            return b;
        }
        function mkSelect(opts, val, fn) {
            const s = document.createElement("select");
            opts.forEach(o => {
                const op = document.createElement("option");
                op.value = o[0];
                op.textContent = o[1];
                s.appendChild(op);
            });
            s.value = String(val);
            s.onchange = function () { fn(this.value); refresh(); };
            return s;
        }
        function renderLines() {
            listEl.textContent = "";
            lines.forEach((ln, i) => {
                const row = document.createElement("div");
                row.className = "line-row";
                row.appendChild(miniBtn("↑", () => {
                    if (i > 0) { const t = lines[i - 1]; lines[i - 1] = lines[i]; lines[i] = t; renderLines(); refresh(); }
                }));
                row.appendChild(miniBtn("↓", () => {
                    if (i < lines.length - 1) { const t = lines[i + 1]; lines[i + 1] = lines[i]; lines[i] = t; renderLines(); refresh(); }
                }));
                const txt = document.createElement("input");
                txt.type = "text";
                txt.placeholder = "第 " + (i + 1) + " 行内容";
                txt.value = ln.t;
                txt.autocomplete = "off";
                txt.oninput = function () { ln.t = this.value; refresh(); };
                row.appendChild(txt);
                row.appendChild(mkSelect([["0", "左"], ["1", "中"], ["2", "右"]], ln.a, v => { ln.a = Number(v); }));
                row.appendChild(mkSelect([["1", "1×"], ["2", "2×"], ["3", "3×"], ["4", "4×"]], ln.s, v => { ln.s = Number(v); }));
                const chk = document.createElement("input");
                chk.type = "checkbox";
                chk.checked = ln.b;
                chk.title = "加粗";
                chk.onchange = function () { ln.b = this.checked; refresh(); };
                row.appendChild(chk);
                row.appendChild(miniBtn("×", () => { lines.splice(i, 1); renderLines(); refresh(); }));
                listEl.appendChild(row);
            });
        }
        function paperWidth() { return wrap.querySelector('input[name="linePaper"]:checked').value === "110" ? 46 : 31; }
        function refresh() {
            const w = paperWidth();
            taPreview.value = lines.map(ln => {
                if (ln.a === 1) return " ".repeat(Math.max(0, Math.floor((w - ln.t.length) / 2))) + ln.t;
                if (ln.a === 2) return " ".repeat(Math.max(0, w - ln.t.length)) + ln.t;
                return ln.t;
            }).join("\n");
        }
        function buildHex() {
            const bytes = [0x1B, 0x40];
            let ok = true;
            lines.forEach(ln => {
                const e = encodePrintLine(ln.t);
                if (e === null) { ok = false; return; }
                bytes.push(0x1B, 0x61, ln.a);                 /* 每行独立对齐 */
                if (ln.b) bytes.push(0x1B, 0x45, 1);          /* 加粗开 */
                const sz = sizeByteFn(ln.s);
                if (sz) bytes.push(0x1D, 0x21, sz);           /* 每行独立字号 */
                e.forEach(b => bytes.push(b));
                bytes.push(0x0A);
                if (sz) bytes.push(0x1D, 0x21, 0x00);
                if (ln.b) bytes.push(0x1B, 0x45, 0);          /* 加粗关 */
            });
            if (!ok) return null;
            const feed = Math.max(0, Math.min(20, Number(wrap.querySelector("#lineFeed").value) || 0));
            for (let i = 0; i < feed; i++) bytes.push(0x0A);
            if (wrap.querySelector("#lineCut").checked) bytes.push(0x1D, 0x56, 0x00);
            return bytesToHexSpaced(bytes);
        }
        function curCfg() {
            return {
                lines: lines.map(l => ({ t: l.t, a: l.a, b: l.b, s: l.s })),
                paper: wrap.querySelector('input[name="linePaper"]:checked').value,
                cut: wrap.querySelector("#lineCut").checked,
                feed: Number(wrap.querySelector("#lineFeed").value) || 0
            };
        }
        function applyCfg(c) {
            lines = (c.lines || []).map(l => ({ t: l.t || "", a: Number(l.a) || 0, b: !!l.b, s: Number(l.s) || 1 }));
            if (!lines.length) lines = [{ t: "", a: 0, b: false, s: 1 }];

                const item = document.createElement("div");

                btnLoad.type = "button";
                btnLoad.className = "btn btn-primary btn-sm";

                const btnDel = document.createElement("button");
                btnDel.type = "button";

    /* ---------- 2b. 商品清单小票(名称/单价/数量 → 自动小计合计,清单可收藏) ---------- */
    const ITEMS_FAV_KEY = "YK_ITEMS_FAV";
    function loadItemFavs() { try { return JSON.parse(localStorage.getItem(ITEMS_FAV_KEY) || "[]"); } catch (e) { return []; } }
    function saveItemFavs(l) { try { localStorage.setItem(ITEMS_FAV_KEY, JSON.stringify(l)); } catch (e) { /* 隐私模式忽略 */ } }
    function printItemsModal(deviceId) {
        const devId = String(deviceId || "").trim();
        if (!devId) { alert("缺少设备编号,请从查询表格行内发起操作"); return; }
        const wrap = openModal("商品清单小票",
            '<p class="modal-note">填写商品自动计算小计与合计;整张清单可存为收藏复用</p>' +
            '<div class="mm-input-row">' +
            '<div><label for="itShop">店名(可选)</label><input type="text" id="itShop" placeholder="例如:张三小店" autocomplete="off"></div>' +
            "</div>" +
            '<div class="chips">' +
            '<label class="chip-opt"><input type="radio" name="itPaper" value="58" checked><span>58mm</span></label>' +
            '<label class="chip-opt"><input type="radio" name="itPaper" value="110"><span>110mm</span></label>' +
            "</div>" +
            '<p class="ops-group">商品(名称 / 单价 / 数量)</p>' +
            '<div id="itemRows"></div>' +
            '<button type="button" class="btn btn-ghost btn-sm" id="itemAdd">+ 添加商品</button>' +
            '<label class="chk"><input type="checkbox" id="itTime" checked> 打印时间</label>' +
            '<label class="chk"><input type="checkbox" id="itCut"> 打印后切刀</label>' +
            '<p class="ops-group">清单收藏(本机保存,最多 30 条)</p>' +
            '<div class="fav-save-row"><input type="text" id="itFavName" placeholder="收藏名称,如:常用菜单" autocomplete="off">' +
            '<button type="button" class="btn btn-ghost btn-sm" id="itFavSave">保存</button></div>' +
            '<div id="itFavList"></div>' +
            "<label>预览(只读)</label>" +
            '<textarea id="itPreview" readonly rows="10" spellcheck="false"></textarea>',
            '<button type="button" class="btn btn-ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn-primary" id="itOk">确认打印</button>');
        let items = [{ n: "", p: "", q: 1 }, { n: "", p: "", q: 1 }, { n: "", p: "", q: 1 }];
        const rowsEl = wrap.querySelector("#itemRows");
        function amountOf(it) { return (Number(it.p) || 0) * (Number(it.q) || 0); }
        function paperW() { return wrap.querySelector('input[name="itPaper"]:checked').value === "110" ? 46 : 31; }
        function renderItems() {
            rowsEl.textContent = "";
            items.forEach((it, i) => {
                const row = document.createElement("div");
                row.className = "item-row";
                const del = document.createElement("button");
                del.type = "button";
                del.className = "mini-btn";
                del.textContent = "×";
                del.onclick = () => { items.splice(i, 1); renderItems(); refresh(); };
                const name = document.createElement("input");
                name.type = "text";
                name.placeholder = "商品 " + (i + 1);
                name.value = it.n;
                name.autocomplete = "off";
                const price = document.createElement("input");
                price.type = "number";
                price.step = "0.01";
                price.min = "0";
                price.placeholder = "单价";
                price.value = it.p;
                const qty = document.createElement("input");
                qty.type = "number";
                qty.step = "1";
                qty.min = "0";
                qty.placeholder = "数量";
                qty.value = it.q;
                const amt = document.createElement("span");
                amt.className = "item-amt";
                amt.title = "小计";
                const upd = () => {
                    it.n = name.value; it.p = price.value; it.q = qty.value;
                    amt.textContent = amountOf(it).toFixed(2);
                    refresh();
                };
                name.oninput = upd;
                price.oninput = upd;
                qty.oninput = upd;
                amt.textContent = amountOf(it).toFixed(2);
                row.appendChild(del);
                row.appendChild(name);
                row.appendChild(price);
                row.appendChild(qty);
                row.appendChild(amt);
                rowsEl.appendChild(row);
            });
        }
        /* 组装商品行:名称靠左、数量*单价 小计 靠右,中间空格补齐 */
        function composeRows() {
            const w = paperW();
            return items.filter(it => it.n.trim()).map(it => {
                const right = (Number(it.q) || 0) + "*" + (Number(it.p) || 0).toFixed(2) + " " + amountOf(it).toFixed(2);
                const maxName = Math.max(1, w - right.length - 1);
                const nm = it.n.length > maxName ? it.n.slice(0, maxName) : it.n;
                return nm + " ".repeat(Math.max(1, w - nm.length - right.length)) + right;
            });
        }
        function totalAmt() { return items.reduce((s, it) => s + (it.n.trim() ? amountOf(it) : 0), 0); }
        function refresh() {
            const w = paperW();
            const dash = "-".repeat(w);
            const shop = wrap.querySelector("#itShop").value.trim();
            const L = [];
            if (shop) L.push(" ".repeat(Math.max(0, Math.floor((w - shop.length * 2) / 2))) + shop);
            L.push(dash);
            composeRows().forEach(l => L.push(l));
            L.push(dash);
            L.push("合计: " + totalAmt().toFixed(2));
            if (wrap.querySelector("#itTime").checked) L.push("时间: " + nowText());
            L.push(dash);
            wrap.querySelector("#itPreview").value = L.join("\n");
        }
        function buildHex() {
            const dash = "-".repeat(paperW());
            const bytes = [0x1B, 0x40];
            let ok = true;
            const push = (s, opt) => {
                const e = encodePrintLine(s);
                if (e === null) { ok = false; return; }
                opt = opt || {};
                bytes.push(0x1B, 0x61, opt.align || 0);
                if (opt.bold) bytes.push(0x1B, 0x45, 1);
                const sz = opt.size ? sizeByteFn(opt.size) : 0;
                if (sz) bytes.push(0x1D, 0x21, sz);
                e.forEach(b => bytes.push(b));
                bytes.push(0x0A);
                if (sz) bytes.push(0x1D, 0x21, 0x00);
                if (opt.bold) bytes.push(0x1B, 0x45, 0);
            };
            const shop = wrap.querySelector("#itShop").value.trim();
            if (shop) push(shop, { align: 1, size: 2 });   /* 店名居中 2 倍 */
            push(dash, {});
            composeRows().forEach(l => push(l, {}));
            push(dash, {});
            push("合计: " + totalAmt().toFixed(2), { bold: true });
            if (wrap.querySelector("#itTime").checked) push("时间: " + nowText(), {});
            push(dash, {});
            bytes.push(0x0A, 0x0A, 0x0A);
            if (wrap.querySelector("#itCut").checked) bytes.push(0x1D, 0x56, 0x00);
            if (!ok) return null;
            return bytesToHexSpaced(bytes);
        }
        function curCfg() {
            return {
                shop: wrap.querySelector("#itShop").value.trim(),
                items: items.map(i => ({ n: i.n, p: i.p, q: i.q })),
                paper: wrap.querySelector('input[name="itPaper"]:checked').value,
                time: wrap.querySelector("#itTime").checked,
                cut: wrap.querySelector("#itCut").checked
            };
        }
        function applyCfg(c) {
            wrap.querySelector("#itShop").value = c.shop || "";
            items = (c.items || []).map(i => ({ n: i.n || "", p: i.p || "", q: i.q || 1 }));
            if (!items.length) items = [{ n: "", p: "", q: 1 }];
            const rd = wrap.querySelector('input[name="itPaper"][value="' + (c.paper === "110" ? "110" : "58") + '"]');
            if (rd) rd.checked = true;
            wrap.querySelector("#itTime").checked = c.time !== false;
            wrap.querySelector("#itCut").checked = !!c.cut;
            renderItems();
            refresh();
        }
        function renderFavs() {
            const box = wrap.querySelector("#itFavList");
            box.textContent = "";
            const favs = loadItemFavs();
            if (!favs.length) {
                const p = document.createElement("p");
                p.className = "tip";
                p.textContent = "暂无收藏:填好商品后存一份,下次一键载入";
                box.appendChild(p);
                return;
            }
            favs.forEach(fav => {
                const item = document.createElement("div");
                item.className = "fav-item";
                const name = document.createElement("span");
                name.className = "fav-name";
                name.textContent = fav.n;
                const meta = document.createElement("span");
                meta.className = "fav-cmd";
                meta.textContent = (fav.c.items || []).length + " 件商品 · " + (fav.c.paper === "110" ? "110mm" : "58mm");
                const btnLoad = document.createElement("button");
                btnLoad.type = "button";
                btnLoad.className = "btn btn-primary btn-sm";
                btnLoad.textContent = "载入";
                btnLoad.onclick = () => applyCfg(fav.c);
                const btnDel = document.createElement("button");
                btnDel.type = "button";
                btnDel.className = "btn btn-ghost btn-sm";
                btnDel.textContent = "删除";
                btnDel.onclick = () => { saveItemFavs(loadItemFavs().filter(x => x.n !== fav.n)); renderFavs(); };
                item.appendChild(name);
                item.appendChild(meta);
                item.appendChild(btnLoad);
                item.appendChild(btnDel);
                box.appendChild(item);
            });
        }
        wrap.querySelector("#itemAdd").onclick = () => { items.push({ n: "", p: "", q: 1 }); renderItems(); refresh(); };
        wrap.querySelector("#itFavSave").onclick = () => {
            const n = wrap.querySelector("#itFavName").value.trim();
            if (!n) { alert("请填写收藏名称"); return; }
            if (!items.some(i => i.n.trim())) { alert("请至少填写一件商品"); return; }
            const favs = loadItemFavs().filter(x => x.n !== n);
            favs.unshift({ n: n, c: curCfg() });
            saveItemFavs(favs.slice(0, 30));
            wrap.querySelector("#itFavName").value = "";
            renderFavs();
        };
        ["input", "change"].forEach(evt => {
            wrap.querySelectorAll("#itShop,#itTime,input[name=itPaper]").forEach(el => el.addEventListener(evt, refresh));
        });
        renderItems();
        refresh();
        renderFavs();
        wrap.querySelector("#itOk").onclick = function () {
            if (!items.some(i => i.n.trim())) { alert("请至少填写一件商品"); return; }
            const hex = buildHex();
            if (hex === null) { alert("中文编码组件未加载:请改用英文或稍后重试"); return; }
            wrap.remove();
            sendHexCmd(devId, hex);
        };
    }

    /* ---------- 2c. 批量条码 / 二维码(每行一个内容,按行序连续打印) ---------- */
    function printBatchLabelModal(deviceId) {
        const devId = String(deviceId || "").trim();
        if (!devId) { alert("缺少设备编号,请从查询表格行内发起操作"); return; }
        const wrap = openModal("批量条码 / 二维码",
            '<p class="modal-note">每行一个内容,按行序连续打印;条码参数与单张标签一致</p>' +
            '<div class="chips">' +
            '<label class="chip-opt"><input type="radio" name="batchType" value="qr"><span>二维码</span></label>' +
            '<label class="chip-opt"><input type="radio" name="batchType" value="code128" checked><span>条码 CODE128</span></label>' +
            '<label class="chip-opt"><input type="radio" name="batchType" value="ean13"><span>条码 EAN13</span></label>' +
            '<label class="chip-opt"><input type="radio" name="batchType" value="code39"><span>条码 CODE39</span></label>' +
            "</div>" +
            "<label for=\"batchInput\">打印内容(每行一个)</label>" +
            '<textarea id="batchInput" rows="6" placeholder="内容1&#10;内容2&#10;内容3" spellcheck="false"></textarea>' +
            '<div class="mm-input-row">' +
            '<div><label for="batchW">二维码尺寸(mm)</label><input type="number" id="batchW" value="40" min="20" max="100"></div>' +
            '<div><label for="batchH">条码高度(mm)</label><input type="number" id="batchH" value="30" min="15" max="100"></div>' +
            '<div><label for="batchNarrow">窄条宽度(点)</label><input type="number" id="batchNarrow" value="2" min="1" max="4"></div>' +
            "</div>" +
            '<label class="chk"><input type="checkbox" id="batchText" checked> 每张下方印内容文字</label>' +
            "<label for=\"batchFeed\">每张走纸行数</label>" +
            '<input type="number" id="batchFeed" value="3" min="0" max="20">' +
            "<label>生成指令(十六进制)</label>" +
            '<textarea id="batchCmd" readonly rows="5" class="mono" spellcheck="false"></textarea>',
            '<button type="button" class="btn btn-ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn-primary" id="batchOk">确认打印</button>');
        const taCmd = wrap.querySelector("#batchCmd");
        function buildBatch() {
            const type = wrap.querySelector('input[name="batchType"]:checked').value;
            const list = wrap.querySelector("#batchInput").value.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            if (!list.length) return { err: "请输入至少一行内容" };
            for (let i = 0; i < list.length; i++) {
                const e = codeDataErr(type, list[i]);
                if (e) return { err: "第 " + (i + 1) + " 行:" + e };
            }
            const mag = Math.max(3, Math.min(8, Math.floor((Math.max(20, Math.min(100, Number(wrap.querySelector("#batchW").value) || 40))) / 8)));
            const bh = Math.max(40, Math.min(240, Math.floor((Math.max(15, Math.min(100, Number(wrap.querySelector("#batchH").value) || 30))) * 8 * 0.6)));
            const narrow = Math.max(2, Math.min(6, Number(wrap.querySelector("#batchNarrow").value) || 2));
            const feed = Math.max(0, Math.min(20, Number(wrap.querySelector("#batchFeed").value) || 0));
            const bytes = [0x1B, 0x40, 0x1B, 0x61, 0x01];   /* 初始化 + 居中 */
            let ok = true;
            list.forEach(line => {
                if (!escposPushCode(bytes, type, line, { mag: mag, bh: bh, narrow: narrow })) ok = false;
                bytes.push(0x0A);
                if (wrap.querySelector("#batchText").checked) {
                    const e = encodePrintLine(line);
                    if (e === null) ok = false;
                    else { e.forEach(b => bytes.push(b)); bytes.push(0x0A); }
                }
                for (let i = 0; i < feed; i++) bytes.push(0x0A);
            });
            bytes.push(0x1B, 0x61, 0x00, 0x0A, 0x0A);
            if (!ok) return { err: "中文编码组件未加载:内容含中文时需联网" };
            return { cmd: bytesToHexSpaced(bytes) };
        }
        function refresh() {
            const r = buildBatch();
            taCmd.value = r.err ? "(" + r.err + ")" : r.cmd;
        }
        ["input", "change"].forEach(evt => {
            wrap.querySelectorAll("#batchInput,#batchW,#batchH,#batchNarrow,#batchFeed,#batchText,input[name=batchType]").forEach(el => {
                el.addEventListener(evt, refresh);
            });
        });
        refresh();
        wrap.querySelector("#batchOk").onclick = function () {
            const r = buildBatch();
            if (r.err) { alert(r.err); return; }
            wrap.remove();
            sendHexCmd(devId, r.cmd);
        };
    }

    /* ---------- 3. 条码 / 二维码标签(ESC/POS,走小票通道下发) ---------- */
    function printLabelModal(deviceId) {
        const devId = String(deviceId || "").trim();
        if (!devId) { alert("缺少设备编号,请从查询表格行内发起操作"); return; }
        const wrap = openModal("条码 / 二维码标签",
            '<p class="modal-note">生成 ESC/POS 指令(走小票打印通道);标签文字可多行、可调顺序;打不出可勾选编辑微调</p>' +
            '<div class="chips">' +
            '<label class="chip-opt"><input type="radio" name="labelType" value="qr"><span>二维码</span></label>' +
            '<label class="chip-opt"><input type="radio" name="labelType" value="code128" checked><span>条码 CODE128</span></label>' +
            '<label class="chip-opt"><input type="radio" name="labelType" value="ean13"><span>条码 EAN13</span></label>' +
            '<label class="chip-opt"><input type="radio" name="labelType" value="code39"><span>条码 CODE39</span></label>' +
            "</div>" +
            "<label for=\"labelData\">打印内容</label>" +
            '<input type="text" id="labelData" placeholder="二维码 / 条码内容" autocomplete="off" spellcheck="false">' +
            "<label for=\"labelTitle\">标签文字(可选,每行一段,按行序打印)</label>" +
            '<textarea id="labelTitle" rows="2" placeholder="例如:货架 A-01&#10;第二行文字" autocomplete="off" spellcheck="false"></textarea>' +
            '<div class="chips">' +
            '<label class="chip-opt"><input type="radio" name="labelOrder" value="textTop" checked><span>文字在上</span></label>' +
            '<label class="chip-opt"><input type="radio" name="labelOrder" value="codeTop"><span>条码在上</span></label>' +
            "</div>" +
            '<div class="mm-input-row">' +
            '<div><label for="labelW">二维码尺寸(mm)</label><input type="number" id="labelW" value="40" min="20" max="100"></div>' +
            '<div><label for="labelH">条码高度(mm)</label><input type="number" id="labelH" value="30" min="15" max="100"></div>' +
            '<div><label for="labelNarrow">窄条宽度(点)</label><input type="number" id="labelNarrow" value="2" min="1" max="4"></div>' +
            "</div>" +
            '<div class="chips">' +
            '<label class="chip-opt"><input type="radio" name="labelFontSize" value="1" checked><span>标签文字:正常</span></label>' +
            '<label class="chip-opt"><input type="radio" name="labelFontSize" value="2"><span>标签文字:2倍</span></label>' +
            '<label class="chip-opt"><input type="radio" name="labelFontSize" value="3"><span>标签文字:3倍</span></label>' +
            '<label class="chip-opt"><input type="radio" name="labelFontSize" value="4"><span>标签文字:4倍</span></label>' +
            "</div>" +
            '<label class="chk"><input type="checkbox" id="enableEditLabel"> 允许编辑指令(默认关闭)</label>' +
            "<label>生成指令(十六进制)</label>" +
            '<textarea id="labelCmd" readonly rows="7" class="mono" spellcheck="false"></textarea>',
            '<button type="button" class="btn btn-ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn-primary" id="labelOk">确认打印</button>');
        const taCmd = wrap.querySelector("#labelCmd");
        const chkEdit = wrap.querySelector("#enableEditLabel");
        chkEdit.addEventListener("change", function () {
            if (this.checked) taCmd.removeAttribute("readonly");
            else { taCmd.setAttribute("readonly", "readonly"); refresh(); }
        });
        function buildLabel() {
            const type = wrap.querySelector('input[name="labelType"]:checked').value;
            const data = wrap.querySelector("#labelData").value.trim();
            const titleLines = wrap.querySelector("#labelTitle").value.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            const fontK = Number(wrap.querySelector('input[name="labelFontSize"]:checked').value) || 1;
            const narrow = Math.max(2, Math.min(6, Number(wrap.querySelector("#labelNarrow").value) || 2));
            const order = wrap.querySelector('input[name="labelOrder"]:checked').value;
            const wMm = Math.max(20, Math.min(100, Number(wrap.querySelector("#labelW").value) || 40));
            const hMm = Math.max(15, Math.min(100, Number(wrap.querySelector("#labelH").value) || 30));
            const verr = codeDataErr(type, data);
            if (verr) return { err: verr };
            /* 改走 ESC/POS 原生条码指令:CPCL 的 B 指令这批 58mm 固件不支持(仅支持 TEXT/BOX 画图) */
            const bytes = [0x1B, 0x40, 0x1B, 0x61, 0x01];   /* 初始化 + 居中 */
            const sizeByte = k => ((((k || 1) - 1) << 4) | ((k || 1) - 1)) & 0xFF;
            let ok = true;
            const pushTitle = () => {
                titleLines.forEach(line => {
                    const e = encodePrintLine(line);
                    if (e === null) { ok = false; return; }
                    const sz = sizeByte(fontK);
                    if (sz) bytes.push(0x1D, 0x21, sz);
                    e.forEach(b => bytes.push(b));
                    bytes.push(0x0A);
                    if (sz) bytes.push(0x1D, 0x21, 0x00);
                });
                bytes.push(0x0A);
            };
            const pushCode = () => {
                /* 指令段与批量打印共用 escposPushCode(CPCL 的 B 指令这批 58mm 固件不支持) */
                const mag = Math.max(3, Math.min(8, Math.floor(wMm / 8)));         /* 二维码模块 3-8 */
                const bh = Math.max(40, Math.min(240, Math.floor(hMm * 8 * 0.6))); /* 条码高度(点) */
                if (!escposPushCode(bytes, type, data, { mag: mag, bh: bh, narrow: narrow })) ok = false;
                bytes.push(0x0A);
            };
            if (order === "textTop") { pushTitle(); pushCode(); }
            else { pushCode(); pushTitle(); }
            bytes.push(0x1B, 0x61, 0x00, 0x0A, 0x0A);
            if (!ok) return { err: "中文编码组件未加载:内容 / 标签文字含中文时需联网" };
            return { cmd: bytesToHexSpaced(bytes) };
        }
        function refresh() {
            if (chkEdit.checked) return;   /* 编辑模式下不覆盖手改内容 */
            const r = buildLabel();
            taCmd.value = r.err ? "(" + r.err + ")" : r.cmd;
        }
        ["input", "change"].forEach(evt => {

    /* ---------- 4. 图片打印(单色位图,GS v 0 指令) ---------- */
    function imageToEscPosBitmap(img, widthDots, threshold, dither) {
        const w = Math.max(16, Math.min(1024, Math.round(widthDots)));
        const h = Math.max(1, Math.round(img.height * (w / img.width)));
        if (h > 1500) return { error: "图片过高(超过 1500 点),请裁剪后再试" };
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const data = ctx.getImageData(0, 0, w, h).data;
        const g = new Float32Array(w * h);
        for (let i = 0; i < w * h; i++) {
            g[i] = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
        }
        const bits = new Uint8Array(w * h);
        if (dither) {
            /* Floyd–Steinberg 抖动:灰度过渡更平滑 */
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const i = y * w + x;
                    const old = g[i];
                    const nv = old < 128 ? 0 : 255;
                    if (nv === 0) bits[i] = 1;
                    const err = old - nv;
                    if (x + 1 < w) g[i + 1] += err * 7 / 16;
                    if (y + 1 < h) {
                        if (x > 0) g[i + w - 1] += err * 3 / 16;
                        g[i + w] += err * 5 / 16;
                        if (x + 1 < w) g[i + w + 1] += err * 1 / 16;
                    }
                }
            }
        } else {
            for (let i = 0; i < w * h; i++) bits[i] = g[i] < threshold ? 1 : 0;
        }
        const bytesPerRow = Math.ceil(w / 8);
        const bytes = [0x1B, 0x40, 0x1D, 0x76, 0x30, 0x00,
            bytesPerRow & 0xFF, (bytesPerRow >> 8) & 0xFF, h & 0xFF, (h >> 8) & 0xFF];
        for (let y = 0; y < h; y++) {
            for (let b = 0; b < bytesPerRow; b++) {
                let byte = 0;
                for (let k = 0; k < 8; k++) {
                    const x = b * 8 + k;
                    if (x < w && bits[y * w + x]) byte |= (0x80 >> k);
                }
                bytes.push(byte);
            }
        }
        bytes.push(0x0A, 0x0A, 0x0A);
        return { width: w, height: h, bits: bits, bytes: bytes };
    }
    function printImageModal(deviceId) {
        const devId = String(deviceId || "").trim();
        if (!devId) { alert("缺少设备编号,请从查询表格行内发起操作"); return; }
        const wrap = openModal("图片打印(单色位图)",
            '<p class="modal-note">选择图片自动转单色位图并以 GS v 0 指令下发,适合 logo / 图形</p>' +
            '<button type="button" class="btn btn-ghost btn-sm" id="imgPick">选择图片</button>' +
            '<input type="file" id="imgFile" accept="image/*" style="display:none">' +
            '<div class="chips">' +
            '<label class="chip-opt"><input type="radio" name="imgWidth" value="384" checked><span>58mm(384点)</span></label>' +
            '<label class="chip-opt"><input type="radio" name="imgWidth" value="832"><span>110mm(832点)</span></label>' +
            "</div>" +
            '<label>黑白阈值:<span id="imgThVal">128</span>(数值越小图案越浅)</label>' +
            '<input type="range" id="imgTh" min="1" max="254" value="128">' +
            '<label class="chk"><input type="checkbox" id="imgDither" checked> 抖动算法(灰度过渡更平滑)</label>' +
            '<canvas id="imgPreview" class="img-preview" width="10" height="10" style="display:none"></canvas>' +
            '<p class="tip" id="imgStat">尚未选择图片</p>',
            '<button type="button" class="btn btn-ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn-primary" id="imgOk" disabled>确认打印</button>');
        const canvas = wrap.querySelector("#imgPreview");
        const stat = wrap.querySelector("#imgStat");
        const fileInp = wrap.querySelector("#imgFile");
        const rangeTh = wrap.querySelector("#imgTh");
        let imgEl = null;
        let lastBitmap = null;
        wrap.querySelector("#imgPick").onclick = () => fileInp.click();
        fileInp.onchange = function () {
            const file = this.files[0];
            this.value = "";
            if (!file) return;
            const im = new Image();
            im.onload = () => { imgEl = im; render(); URL.revokeObjectURL(im.src); };
            im.onerror = () => alert("图片加载失败,请换一张试试");
            im.src = URL.createObjectURL(file);
        };
        function currentOpts() {
            return {
                widthDots: Number(wrap.querySelector('input[name="imgWidth"]:checked').value) || 384,
                threshold: Number(rangeTh.value) || 128,
                dither: wrap.querySelector("#imgDither").checked
            };
        }
        function render() {
            if (!imgEl) return;
            const r = imageToEscPosBitmap(imgEl, currentOpts().widthDots, currentOpts().threshold, currentOpts().dither);
            if (r.error) { lastBitmap = null; stat.textContent = r.error; canvas.style.display = "none"; wrap.querySelector("#imgOk").disabled = true; return; }
            lastBitmap = r;
            wrap.querySelector("#imgOk").disabled = false;   /* 位图生成成功后解锁确认按钮 */
            canvas.style.display = "block";
            canvas.width = r.width;
            canvas.height = r.height;
            const ctx = canvas.getContext("2d");
            const imgData = ctx.createImageData(r.width, r.height);
            for (let i = 0; i < r.width * r.height; i++) {
                const v = r.bits[i] ? 0 : 255;
                imgData.data[i * 4] = v; imgData.data[i * 4 + 1] = v; imgData.data[i * 4 + 2] = v; imgData.data[i * 4 + 3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);
            stat.textContent = "尺寸 " + r.width + "×" + r.height + " 点 · 指令约 " + Math.ceil(r.bytes.length * 3 / 1024) + " KB";
        }
        ["input", "change"].forEach(evt => {
            wrap.querySelectorAll('input[name="imgWidth"],#imgDither').forEach(el => el.addEventListener(evt, render));
        });
        rangeTh.addEventListener("input", function () {
            wrap.querySelector("#imgThVal").textContent = this.value;
            render();
        });
        wrap.querySelector("#imgOk").onclick = function () {
            if (!lastBitmap) { alert("请先选择图片"); return; }
            const hex = bytesToHexSpaced(lastBitmap.bytes);
            wrap.remove();
            sendHexCmd(devId, hex);
        };
    }

    /* ---------- 5. 自定义指令 + 收藏(本机 localStorage 保存) ---------- */
    const CMD_FAV_KEY = "YK_CMD_FAV";
    function loadCmdFavs() {
        try { return JSON.parse(localStorage.getItem(CMD_FAV_KEY) || "[]"); } catch (e) { return []; }
    }
    function saveCmdFavs(list) {
        try { localStorage.setItem(CMD_FAV_KEY, JSON.stringify(list)); } catch (e) { /* 隐私模式等场景忽略 */ }
    }
    function customCmdModal(deviceId) {
        const devId = String(deviceId || "").trim();
        if (!devId) { alert("缺少设备编号,请从查询表格行内发起操作"); return; }
        const wrap = openModal("自定义指令 · 收藏本地",
            '<p class="modal-note">粘贴任意指令直接下发(十六进制或 CPCL/ESC 文本);常用指令可保存到收藏(本机保存,最多 50 条)</p>' +
            '<textarea id="customCmdInput" rows="4" class="mono" placeholder="十六进制:1B 40 0A&#10;或 CPCL 文本:! 0 200 200 240 1 …" spellcheck="false"></textarea>' +
            "<label for=\"favName\">收藏名称(保存时填写)</label>" +
            '<input type="text" id="favName" placeholder="例如:走纸三行" autocomplete="off">' +
            '<p class="ops-group">我的收藏</p>' +
            '<div id="favList"></div>',
            '<button type="button" class="btn btn-ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn-ghost" id="favSave">保存到本地收藏</button>' +
            '<button type="button" class="btn btn-primary" id="customOk">下发指令</button>');
        const list = wrap.querySelector("#favList");
        function renderFavs() {
            list.textContent = "";
            const favs = loadCmdFavs();
            if (!favs.length) {
                const p = document.createElement("p");
                p.className = "tip";
                p.textContent = "暂无收藏:填写指令和名称后点「保存到本地收藏」";
                list.appendChild(p);
                return;
            }
            favs.forEach(fav => {
                const item = document.createElement("div");
                item.className = "fav-item";
                const name = document.createElement("span");
                name.className = "fav-name";
                name.textContent = fav.n;
                const cmd = document.createElement("span");
                cmd.className = "fav-cmd";
                cmd.textContent = fav.c;
                cmd.title = fav.c;
                const btnRun = document.createElement("button");
                btnRun.type = "button";
                btnRun.className = "btn btn-primary btn-sm";
                btnRun.textContent = "下发";
                btnRun.onclick = () => { wrap.remove(); sendHexCmd(devId, fav.c); };
                const btnDel = document.createElement("button");
                btnDel.type = "button";
                btnDel.className = "btn btn-ghost btn-sm";
                btnDel.textContent = "删除";
                btnDel.onclick = () => {
                    saveCmdFavs(loadCmdFavs().filter(x => !(x.n === fav.n && x.c === fav.c)));
                    renderFavs();
                };
                item.appendChild(name);
                item.appendChild(cmd);
                item.appendChild(btnRun);
                item.appendChild(btnDel);
                list.appendChild(item);
            });
        }
        wrap.querySelector("#favSave").onclick = function () {
            const c = wrap.querySelector("#customCmdInput").value.trim();
            const n = wrap.querySelector("#favName").value.trim();
            if (!c) { alert("请先填写指令内容"); return; }
            if (!n) { alert("请填写收藏名称"); return; }
            const favs = loadCmdFavs();
            favs.unshift({ n: n, c: c, t: Date.now() });
            saveCmdFavs(favs.slice(0, 50));
            wrap.querySelector("#favName").value = "";
            renderFavs();
        };
        wrap.querySelector("#customOk").onclick = function () {
            const c = wrap.querySelector("#customCmdInput").value.trim();
            if (!c) { alert("指令不能为空"); return; }
            wrap.remove();
            sendHexCmd(devId, c);
        };
        renderFavs();
    }
</script>
<script>
    /* ========== 固件升级(文件 / 链接) ========== */
    function fileToHexString(file) {
        return new Promise((resolve, reject) => {
            if (!file) { reject(new Error("No file provided")); return; }
            const reader = new FileReader();
            reader.onload = function (e) {
                const arrayBuffer = e.target.result;
                const uint8Array = new Uint8Array(arrayBuffer);
                const hexString = Array.from(uint8Array).map(byte => byte.toString(16).padStart(2, "0").toUpperCase()).join("");
                resolve(hexString);
            };
            reader.onerror = () => reject(new Error("读取文件时出错"));
            reader.readAsArrayBuffer(file);
        });
    }
    var upgradeDeviceId = "";
    var upgradeVersion = "";
    const fileInput = document.getElementById("fileInput");
    fileInput.onchange = async function (event) {
        const file = event.target.files[0];
        if (!file) return;
        fileInput.value = "";
        if (!ensureCreds()) return;   /* 未配置凭据:弹输入框,文件选择作废重来 */
        try {
            showLoading(true);
            const hexString = await fileToHexString(file);
            postForm(printer_url, {
                apiKey: "ec-printer-mqtt-develop-upgrade",
                secretId: secretId,
                secretKey: secretKey,
                deviceId: upgradeDeviceId,
                cmd: hexString,
                version: upgradeVersion
            })
            .then(data => renderRes(data && data.data ? data.data : data))
            .catch(() => showResError("执行失败:请求未发出或网络异常"))
            .finally(() => showLoading(false));
        } catch (error) {
            console.error(error);
            showLoading(false);
        }
    };
    function upgradeFirmware(deviceId) {
        const devId = String(deviceId || "").trim();
        if (!devId) { alert("缺少设备编号,请从查询表格行内发起操作"); return; }
        const modal = openModal("固件文件升级",
            '<label for="upgradeVersionInput">固件版本号</label>' +
            '<input type="text" id="upgradeVersionInput" placeholder="例如:V1.0.0" autocomplete="off">' +
            '<p class="modal-note" style="margin-top:12px;">确认后将打开文件选择器,固件文件会转为十六进制后下发</p>',
            '<button type="button" class="btn btn-ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn-primary" id="upgradeConfirmBtn">确认并选择文件</button>');
        modal.querySelector("#upgradeVersionInput").focus();
        modal.querySelector("#upgradeConfirmBtn").onclick = function () {
            const version = modal.querySelector("#upgradeVersionInput").value.trim();
            if (!version) { alert("请输入固件版本号"); return; }
            upgradeDeviceId = devId;
            upgradeVersion = version;
            modal.remove();
            document.getElementById("fileInput").click();
        };
    }
    function stringToHexUpper(str) {
        const encoder = new TextEncoder();
        const bytes = encoder.encode(str);
        return Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
    }
    function upgradeFirmwareUrl(deviceId) {
        const devId = String(deviceId || "").trim();
        if (!devId) { alert("缺少设备编号,请从查询表格行内发起操作"); return; }
        const modal = openModal("固件链接升级",
            '<label for="upgradeUrlInput">升级文件外链地址</label>' +
            '<textarea id="upgradeUrlInput" rows="3" class="mono" placeholder="https://…" spellcheck="false"></textarea>',
            '<button type="button" class="btn btn-ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn-primary" id="upgradeUrlOk">确认升级</button>');
        modal.querySelector("#upgradeUrlInput").focus();
        modal.querySelector("#upgradeUrlOk").onclick = function () {
            const cmdInput = modal.querySelector("#upgradeUrlInput").value.trim();
            if (!cmdInput) { alert("指令不能为空"); return; }
            const cmdInputCmd = "1B81" + stringToHexUpper(cmdInput) + "0D0A";
            modal.remove();
            sendHexCmd(devId, cmdInputCmd);
        };
    }
